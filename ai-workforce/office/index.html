<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Studio Floor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#EEF1F4;
    --ink:#1B2027;
    --muted:#5B6470;
    --panel-bg:rgba(255,255,255,0.90);
    --panel-border:rgba(27,32,39,0.12);
    --chip-bg:rgba(27,32,39,0.05);
    --shadow:0 24px 64px rgba(20,24,31,0.16);
    --a-strategy:#C97F22;
    --a-research:#1F9690;
    --a-content:#D24E64;
    --a-software:#3560CC;
    --a-sales:#2F9350;
    --a-delivery:#6E4FCC;
    --a-growth:#B33F94;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161D;
      --ink:#ECEEF2;
      --muted:#98A1AE;
      --panel-bg:rgba(22,26,34,0.90);
      --panel-border:rgba(236,238,242,0.12);
      --chip-bg:rgba(236,238,242,0.06);
      --shadow:0 24px 64px rgba(0,0,0,0.55);
      --a-strategy:#E0A24A;
      --a-research:#3FC0B9;
      --a-content:#E67B8E;
      --a-software:#6C8FE8;
      --a-sales:#57BE79;
      --a-delivery:#9782E8;
      --a-growth:#D871BC;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161D;
    --ink:#ECEEF2;
    --muted:#98A1AE;
    --panel-bg:rgba(22,26,34,0.90);
    --panel-border:rgba(236,238,242,0.12);
    --chip-bg:rgba(236,238,242,0.06);
    --shadow:0 24px 64px rgba(0,0,0,0.55);
    --a-strategy:#E0A24A;
    --a-research:#3FC0B9;
    --a-content:#E67B8E;
    --a-software:#6C8FE8;
    --a-sales:#57BE79;
    --a-delivery:#9782E8;
    --a-growth:#D871BC;
    color-scheme: dark;
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  *{box-sizing:border-box;}
  body{
    font-family:"Work Sans",system-ui,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  #scene.hover{cursor:pointer;}

  #app{position:fixed;inset:0;pointer-events:none;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;justify-content:space-between;}

  header{pointer-events:auto;display:flex;flex-direction:column;gap:2px;max-width:min(420px,70vw);}
  header .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  header h1{
    font-family:"Big Shoulders Display",sans-serif;
    font-weight:800;font-size:clamp(28px,4.2vw,40px);line-height:.95;margin:2px 0 0 0;
    letter-spacing:.01em;
  }

  #backBtn{
    pointer-events:auto;margin-top:14px;align-self:flex-start;
    display:none;align-items:center;gap:8px;
    background:var(--panel-bg);border:1px solid var(--panel-border);
    color:var(--ink);font-family:"Work Sans",sans-serif;font-weight:600;font-size:13px;
    padding:10px 16px 10px 12px;border-radius:999px;cursor:pointer;
    box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  #backBtn.show{display:inline-flex;}
  #backBtn svg{width:14px;height:14px;}

  #hint{
    pointer-events:none;align-self:center;
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);
    background:var(--panel-bg);border:1px solid var(--panel-border);
    padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);
    transition:opacity .4s ease;
  }
  #hint.hidden{opacity:0;}

  #legend{
    pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px;max-width:640px;
  }
  #legend button{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.02em;
    display:flex;align-items:center;gap:7px;
    background:var(--panel-bg);border:1px solid var(--panel-border);
    color:var(--ink);padding:7px 11px 7px 9px;border-radius:999px;cursor:pointer;
    box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  #legend button .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  #legend button.active{outline:2px solid var(--ink);outline-offset:1px;}

  #panel{
    position:fixed;top:0;right:0;height:100%;width:min(380px,100%);
    background:var(--panel-bg);border-left:1px solid var(--panel-border);
    backdrop-filter:blur(14px);box-shadow:var(--shadow);
    transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
    padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px)) 22px;
    overflow-y:auto;pointer-events:auto;
  }
  #panel.open{transform:translateX(0);}
  #panel .bar{width:38px;height:5px;border-radius:99px;margin-bottom:16px;}
  #panel .code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;}
  #panel h2{
    font-family:"Big Shoulders Display",sans-serif;font-weight:800;
    font-size:30px;line-height:1;margin:6px 0 4px 0;
  }
  #panel .role{font-size:13px;color:var(--muted);margin-bottom:20px;}
  #panel .agents{display:flex;flex-direction:column;gap:10px;}
  .agent-card{
    background:var(--chip-bg);border:1px solid var(--panel-border);
    border-radius:12px;padding:12px 14px;
  }
  .agent-card .name{font-weight:600;font-size:14px;margin-bottom:3px;}
  .agent-card .desc{font-size:12.5px;color:var(--muted);line-height:1.45;}

  @media (max-width:720px){
    #panel{
      top:auto;bottom:0;right:0;left:0;width:100%;height:min(62vh,520px);
      border-left:none;border-top:1px solid var(--panel-border);
      border-radius:18px 18px 0 0;
      transform:translateY(105%);
    }
    #panel.open{transform:translateY(0);}
    #legend{max-width:100%;}
    header{max-width:80vw;}
    #hint{font-size:11px;padding:7px 12px;}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="app">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <header>
        <span class="eyebrow">35 agents · 7 departments</span>
        <h1>The Studio Floor</h1>
      </header>
      <button id="backBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span id="backLabel">Back to overview</span>
      </button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
    <div id="hint">Drag to look around · click a room to walk in</div>
    <div id="legend"></div>
  </div>
</div>

<div id="panel">
  <div class="bar" id="panelBar"></div>
  <div class="code" id="panelCode"></div>
  <h2 id="panelTitle"></h2>
  <div class="role" id="panelSub"></div>
  <div class="agents" id="panelAgents"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- data ----------
  var DEPARTMENTS = [
    {
      id:"strategy", code:"00", name:"Strategy & Operations", tag:"Runs the studio itself",
      cssVar:"--a-strategy", hex:0xC97F22, x:0, z:0, w:6.4, d:6.4, central:true,
      agents:[
        {name:"Chief of Staff", desc:"Prioritizes the studio's work queue, tracks capacity across all 35 agents."},
        {name:"Project Manager", desc:"Breaks a signed job into tasks and assigns them to the right department."},
        {name:"Finance & Bookkeeping Agent", desc:"Tracks invoices sent/paid, expenses, and margin per job."},
        {name:"Contract & Proposal Drafting Agent", desc:"Drafts SOWs, contracts, and NDAs from templates."},
        {name:"Quality Bar Agent", desc:"Reviews every deliverable against the client brief before it ships."}
      ]
    },
    {
      id:"research", code:"01", name:"Research & Intelligence", tag:"Finds the opportunities",
      cssVar:"--a-research", hex:0x1F9690, x:0, z:-9, w:5.4, d:5.4,
      agents:[
        {name:"Opportunity Scout", desc:"Scans for underserved niches and side-hustle categories worth entering."},
        {name:"Market Research Agent", desc:"Sizes a market: demand signals, pricing norms, buyer pain points."},
        {name:"Competitor Analysis Agent", desc:"Profiles competitors for a given niche or client."},
        {name:"Client / Lead Researcher", desc:"Builds a one-page dossier on a prospect before outreach."},
        {name:"Trend Scout", desc:"Tracks emerging tools, platforms, and demand shifts."}
      ]
    },
    {
      id:"content", code:"02", name:"Content & Creative", tag:"Writes and designs",
      cssVar:"--a-content", hex:0xD24E64, x:7.79, z:-4.5, w:5.4, d:5.4,
      agents:[
        {name:"Copywriter", desc:"Website, landing page, and ad copy."},
        {name:"SEO / Blog Writer", desc:"Long-form articles and SEO content."},
        {name:"Social Media Agent", desc:"Platform-native posts and a content calendar."},
        {name:"Video / Podcast Script Agent", desc:"Scripts and outlines for video or audio content."},
        {name:"Brand & Graphic Design Agent", desc:"Brand guides, simple graphics, and slide decks."}
      ]
    },
    {
      id:"software", code:"03", name:"Software & Technical", tag:"Builds the deliverable",
      cssVar:"--a-software", hex:0x3560CC, x:7.79, z:4.5, w:5.4, d:5.4,
      agents:[
        {name:"Full-Stack Dev Agent", desc:"Builds websites, small apps, and integrations."},
        {name:"Automation / Scripting Agent", desc:"Builds workflow automations that save a client real hours."},
        {name:"Data Analyst Agent", desc:"Cleans data and builds dashboards or reports."},
        {name:"QA / Testing Agent", desc:"Tests everything before it ships."},
        {name:"DevOps / Deployment Agent", desc:"Handles hosting, deployment, and uptime monitoring."}
      ]
    },
    {
      id:"sales", code:"04", name:"Sales & Client Acquisition", tag:"Turns leads into signed jobs",
      cssVar:"--a-sales", hex:0x2F9350, x:0, z:9, w:5.4, d:5.4,
      agents:[
        {name:"Outreach / Cold Email Agent", desc:"Drafts personalized outreach at volume — never sends without approval."},
        {name:"Proposal Writer", desc:"Turns a scoped opportunity into a priced proposal."},
        {name:"Sales Call Prep Agent", desc:"Preps talking points, objections, and pricing anchors."},
        {name:"CRM / Pipeline Manager Agent", desc:"Tracks every lead's stage and next action."},
        {name:"Partnerships Agent", desc:"Finds agencies and platforms worth partnering with."}
      ]
    },
    {
      id:"delivery", code:"05", name:"Client Delivery & Support", tag:"Keeps clients happy",
      cssVar:"--a-delivery", hex:0x6E4FCC, x:-7.79, z:4.5, w:5.4, d:5.4,
      agents:[
        {name:"Onboarding Agent", desc:"Turns a signed deal into a kickoff packet and intake form."},
        {name:"Account Manager Agent", desc:"Owns the client relationship day-to-day."},
        {name:"Support / Help Desk Agent", desc:"Answers routine client questions and triages issues."},
        {name:"Deliverable QA Reviewer", desc:"Final check that what's shipping matches what was promised."},
        {name:"Documentation Agent", desc:"Writes handoff docs, SOPs, and how-to guides."}
      ]
    },
    {
      id:"growth", code:"06", name:"Growth & Marketing", tag:"Builds inbound demand",
      cssVar:"--a-growth", hex:0xB33F94, x:-7.79, z:-4.5, w:5.4, d:5.4,
      agents:[
        {name:"SEO Agent", desc:"Keyword strategy and on-page SEO."},
        {name:"Paid Ads Agent", desc:"Drafts ad copy, targeting, and budget plans."},
        {name:"Email Marketing Agent", desc:"Builds nurture sequences and newsletters."},
        {name:"Community / Engagement Agent", desc:"Drafts engagement content for communities and forums."},
        {name:"Analytics / Reporting Agent", desc:"Tracks what's actually converting across the studio."}
      ]
    }
  ];

  var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- theme ----------
  function readCssColor(name, fallback){
    try{
      var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      if(!v) return fallback;
      return parseInt(v.replace("#",""), 16);
    }catch(e){ return fallback; }
  }
  function currentBG(){ return readCssColor("--bg", 0xeef1f4); }

  // ---------- three.js setup ----------
  var canvas = document.getElementById("scene");
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(currentBG(), 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);

  var OVERVIEW_POS = new THREE.Vector3(0, 21, 25);
  var OVERVIEW_LOOK = new THREE.Vector3(0, 0, 0);
  camera.position.copy(OVERVIEW_POS);
  camera.lookAt(OVERVIEW_LOOK);

  function resize(){
    var w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener("resize", resize);

  // lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f4a, 0.85));
  var sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(14, 22, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
  sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
  sun.shadow.camera.far = 60;
  scene.add(sun);

  // base floor
  var baseMat = new THREE.MeshStandardMaterial({color:0xd7dbe0, roughness:0.95});
  var base = new THREE.Mesh(new THREE.CircleGeometry(19, 48), baseMat);
  base.rotation.x = -Math.PI/2;
  base.receiveShadow = true;
  scene.add(base);

  // faint grid ring (blueprint feel)
  var grid = new THREE.GridHelper(38, 38, 0xffffff, 0xffffff);
  grid.material.opacity = 0.06;
  grid.material.transparent = true;
  grid.position.y = 0.01;
  scene.add(grid);

  var clickables = []; // {mesh, dept}
  var wallMats = {}; // dept.id -> material (for hover highlight)

  function buildRoom(dept){
    var group = new THREE.Group();
    group.position.set(dept.x, 0, dept.z);

    var hw = dept.w/2, hd = dept.d/2;
    var wallH = dept.central ? 2.6 : 2.25;
    var wallT = 0.22;

    var floorMat = new THREE.MeshStandardMaterial({color:dept.hex, roughness:0.9, metalness:0.02});
    floorMat.color.multiplyScalar(1.35).lerp(new THREE.Color(0xffffff), 0.55);
    var floor = new THREE.Mesh(new THREE.BoxGeometry(dept.w, 0.12, dept.d), floorMat);
    floor.position.y = 0.06;
    floor.receiveShadow = true;
    group.add(floor);

    var wallMat = new THREE.MeshStandardMaterial({color:dept.hex, roughness:0.7, metalness:0.05, emissive:new THREE.Color(dept.hex), emissiveIntensity:0.0});
    wallMats[dept.id] = wallMat;

    function wall(w,h,d,x,y,z){
      var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
      m.position.set(x,y,z);
      m.castShadow = true; m.receiveShadow = true;
      group.add(m);
    }
    // open side faces the lobby (toward origin) -> omit the wall nearest origin
    var dirToCenter = new THREE.Vector2(-dept.x, -dept.z);
    var openSide = "z-"; // default for central room: leave a gap on +z (south) as its "entrance" is omnidirectional-ish
    if(!dept.central){
      if(Math.abs(dirToCenter.x) > Math.abs(dirToCenter.y)){
        openSide = dirToCenter.x > 0 ? "x+" : "x-";
      } else {
        openSide = dirToCenter.y > 0 ? "z+" : "z-";
      }
    }
    var gap = (dept.central ? dept.w : dept.w) * 0.42;
    if(dept.central){
      // command room: door-sized gaps on all four sides
      var g = dept.w*0.36;
      wall(hw*2, wallH, wallT, 0, wallH/2, -hd);
      wall(hw*2, wallH, wallT, 0, wallH/2, hd);
      wall(wallT, wallH, hd*2, -hw, wallH/2, 0);
      wall(wallT, wallH, hd*2, hw, wallH/2, 0);
    } else if(openSide === "z-"){
      wall(dept.w, wallH, wallT, 0, wallH/2, hd);
      wall((dept.w-gap)/2, wallH, wallT, -(gap/2+(dept.w-gap)/4), wallH/2, -hd);
      wall((dept.w-gap)/2, wallH, wallT, (gap/2+(dept.w-gap)/4), wallH/2, -hd);
      wall(wallT, wallH, dept.d, -hw, wallH/2, 0);
      wall(wallT, wallH, dept.d, hw, wallH/2, 0);
    } else if(openSide === "z+"){
      wall(dept.w, wallH, wallT, 0, wallH/2, -hd);
      wall((dept.w-gap)/2, wallH, wallT, -(gap/2+(dept.w-gap)/4), wallH/2, hd);
      wall((dept.w-gap)/2, wallH, wallT, (gap/2+(dept.w-gap)/4), wallH/2, hd);
      wall(wallT, wallH, dept.d, -hw, wallH/2, 0);
      wall(wallT, wallH, dept.d, hw, wallH/2, 0);
    } else if(openSide === "x-"){
      wall(dept.w, wallH, wallT, 0, wallH/2, -hd);
      wall(dept.w, wallH, wallT, 0, wallH/2, hd);
      wall(wallT, wallH, (dept.d-gap)/2, hw, wallH/2, -(gap/2+(dept.d-gap)/4));
      wall(wallT, wallH, (dept.d-gap)/2, hw, wallH/2, (gap/2+(dept.d-gap)/4));
    } else {
      wall(dept.w, wallH, wallT, 0, wallH/2, -hd);
      wall(dept.w, wallH, wallT, 0, wallH/2, hd);
      wall(wallT, wallH, (dept.d-gap)/2, -hw, wallH/2, -(gap/2+(dept.d-gap)/4));
      wall(wallT, wallH, (dept.d-gap)/2, -hw, wallH/2, (gap/2+(dept.d-gap)/4));
    }

    // desks: 5 small blocks in a row
    var deskMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.6});
    var n = dept.agents.length;
    var spacing = Math.min(dept.w, dept.d) * 0.72 / n;
    var startOffset = -((n-1)*spacing)/2;
    for(var i=0;i<n;i++){
      var desk = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.42,0.5), deskMat);
      desk.position.set(startOffset + i*spacing, 0.21 + 0.12, dept.central ? -hd*0.4 : hd*0.15);
      desk.castShadow = true; desk.receiveShadow = true;
      group.add(desk);
      var chairMat = new THREE.MeshStandardMaterial({color:dept.hex, roughness:0.5});
      var chair = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.38,10), chairMat);
      chair.position.set(startOffset + i*spacing, 0.21+0.19, (dept.central ? -hd*0.4 : hd*0.15) + 0.42);
      chair.castShadow = true;
      group.add(chair);
    }

    // sign sprite
    var sign = makeTextSprite(dept.name.toUpperCase(), "#ffffff", "rgba(0,0,0,0.001)");
    sign.position.set(0, wallH + 0.9, dept.central ? 0 : -hd*0.05);
    sign.userData.dept = dept;
    group.add(sign);

    scene.add(group);

    // clickable hit-plane
    var hit = new THREE.Mesh(
      new THREE.PlaneGeometry(dept.w+0.6, dept.d+0.6),
      new THREE.MeshBasicMaterial({visible:false})
    );
    hit.rotation.x = -Math.PI/2;
    hit.position.set(dept.x, 0.02, dept.z);
    hit.userData.dept = dept;
    scene.add(hit);
    clickables.push(hit);

    return group;
  }

  function makeTextSprite(text, color, bg){
    var c = document.createElement("canvas");
    var scale = 4;
    var ctx = c.getContext("2d");
    var font = "700 " + (30*scale) + "px 'Big Shoulders Display', sans-serif";
    ctx.font = font;
    var padX = 20*scale;
    var w = Math.ceil(ctx.measureText(text).width) + padX*2;
    var h = 56*scale;
    c.width = w; c.height = h;
    ctx = c.getContext("2d");
    ctx.font = font;
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = color;
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.letterSpacing = (2*scale)+"px";
    ctx.fillText(text, w/2, h/2+2*scale);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    var mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
    var sprite = new THREE.Sprite(mat);
    var worldH = 1.1;
    sprite.scale.set(worldH * (w/h), worldH, 1);
    return sprite;
  }

  DEPARTMENTS.forEach(buildRoom);

  // avatar (the viewer)
  var avatar = new THREE.Group();
  var avatarBody = new THREE.Mesh(
    new THREE.ConeGeometry(0.28, 0.7, 16),
    new THREE.MeshStandardMaterial({color:0x1B2027, roughness:0.4})
  );
  avatarBody.position.y = 0.45;
  avatarBody.castShadow = true;
  avatar.add(avatarBody);
  var avatarRing = new THREE.Mesh(
    new THREE.RingGeometry(0.38,0.5,24),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.5, side:THREE.DoubleSide})
  );
  avatarRing.rotation.x = -Math.PI/2;
  avatarRing.position.y = 0.03;
  avatar.add(avatarRing);
  avatar.position.set(0, 0, 13);
  scene.add(avatar);

  // ---------- interaction / camera state machine ----------
  var raycaster = new THREE.Raycaster();
  var mouseNDC = new THREE.Vector2(10,10);
  var activeDept = null;

  var anim = null; // {t0, dur, fromCamPos, toCamPos, fromLook, toLook, fromAvatar, toAvatar}
  function startAnim(toCamPos, toLook, toAvatar){
    anim = {
      t0: performance.now(),
      dur: prefersReducedMotion ? 1 : 1100,
      fromCamPos: camera.position.clone(),
      toCamPos: toCamPos.clone(),
      fromLook: currentLook.clone(),
      toLook: toLook.clone(),
      fromAvatar: avatar.position.clone(),
      toAvatar: toAvatar.clone()
    };
  }
  var currentLook = OVERVIEW_LOOK.clone();

  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  function roomCameraTarget(dept){
    if(dept.central){
      return {pos:new THREE.Vector3(0, 7.2, 8.5), look:new THREE.Vector3(0,1.1,0)};
    }
    var dir = new THREE.Vector2(dept.x, dept.z).normalize();
    var pos = new THREE.Vector3(dept.x - dir.x*3.4, 6.4, dept.z - dir.y*3.4);
    var look = new THREE.Vector3(dept.x, 1.1, dept.z);
    return {pos:pos, look:look};
  }

  function selectDept(dept){
    activeDept = dept;
    var t = roomCameraTarget(dept);
    var avatarTarget = dept.central ? new THREE.Vector3(0,0,2.6) : new THREE.Vector3(dept.x, 0, dept.z + (dept.z>=0?-1.6:1.6));
    // place avatar just inside the room, roughly toward its open side
    var dir = new THREE.Vector2(dept.x, dept.z);
    if(dir.length() > 0.01){ dir.normalize(); avatarTarget = new THREE.Vector3(dept.x - dir.x*0.6, 0, dept.z - dir.y*0.6); }
    startAnim(t.pos, t.look, avatarTarget);
    openPanel(dept);
    document.getElementById("backBtn").classList.add("show");
    document.getElementById("hint").classList.add("hidden");
    updateLegendActive();
  }

  function goOverview(){
    activeDept = null;
    startAnim(OVERVIEW_POS, OVERVIEW_LOOK, new THREE.Vector3(0,0,13));
    closePanel();
    document.getElementById("backBtn").classList.remove("show");
    updateLegendActive();
  }

  // panel
  var panel = document.getElementById("panel");
  function openPanel(dept){
    document.getElementById("panelBar").style.background = "var(" + dept.cssVar + ")";
    document.getElementById("panelCode").textContent = "ROOM " + dept.code;
    document.getElementById("panelTitle").textContent = dept.name;
    document.getElementById("panelSub").textContent = dept.tag + " · " + dept.agents.length + " agents";
    var wrap = document.getElementById("panelAgents");
    wrap.innerHTML = "";
    dept.agents.forEach(function(a){
      var el = document.createElement("div");
      el.className = "agent-card";
      var n = document.createElement("div"); n.className="name"; n.textContent = a.name;
      var d = document.createElement("div"); d.className="desc"; d.textContent = a.desc;
      el.appendChild(n); el.appendChild(d);
      wrap.appendChild(el);
    });
    panel.classList.add("open");
  }
  function closePanel(){ panel.classList.remove("open"); }

  // legend
  var legend = document.getElementById("legend");
  DEPARTMENTS.forEach(function(dept){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.id = dept.id;
    var dot = document.createElement("span"); dot.className="dot"; dot.style.background = "var(" + dept.cssVar + ")";
    var label = document.createElement("span"); label.textContent = dept.code + " · " + dept.name;
    btn.appendChild(dot); btn.appendChild(label);
    btn.addEventListener("click", function(){ selectDept(dept); });
    legend.appendChild(btn);
  });
  function updateLegendActive(){
    Array.prototype.forEach.call(legend.children, function(btn){
      btn.classList.toggle("active", !!activeDept && btn.dataset.id === activeDept.id);
    });
  }

  document.getElementById("backBtn").addEventListener("click", goOverview);
  window.addEventListener("keydown", function(e){
    if(e.key === "Escape" && activeDept) goOverview();
  });

  function pointerToNDC(e){
    var x = (e.touches ? e.touches[0].clientX : e.clientX);
    var y = (e.touches ? e.touches[0].clientY : e.clientY);
    mouseNDC.x = (x/innerWidth)*2 - 1;
    mouseNDC.y = -(y/innerHeight)*2 + 1;
  }

  canvas.addEventListener("click", function(e){
    pointerToNDC(e);
    raycaster.setFromCamera(mouseNDC, camera);
    var hits = raycaster.intersectObjects(clickables);
    if(hits.length){
      var dept = hits[0].object.userData.dept;
      if(!activeDept || activeDept.id !== dept.id) selectDept(dept);
    }
  });

  canvas.addEventListener("pointermove", function(e){
    pointerToNDC(e);
    raycaster.setFromCamera(mouseNDC, camera);
    var hits = raycaster.intersectObjects(clickables);
    canvas.classList.toggle("hover", hits.length > 0);
  });

  // gentle manual orbit drag on the overview (rotate around Y only), disabled while transitioning
  var dragging = false, lastX = 0, overviewYaw = 0;
  canvas.addEventListener("pointerdown", function(e){ dragging = true; lastX = (e.touches?e.touches[0].clientX:e.clientX); canvas.style.cursor="grabbing"; });
  window.addEventListener("pointerup", function(){ dragging = false; canvas.style.cursor="grab"; });
  window.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var x = (e.touches?e.touches[0].clientX:e.clientX);
    var dx = x - lastX; lastX = x;
    overviewYaw += dx * 0.004;
  });

  // theme sync
  var mql = window.matchMedia("(prefers-color-scheme: dark)");
  function syncClearColor(){ renderer.setClearColor(currentBG(), 1); }
  mql.addEventListener && mql.addEventListener("change", syncClearColor);
  var mo = new MutationObserver(syncClearColor);
  mo.observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

  // ---------- render loop ----------
  function frame(now){
    requestAnimationFrame(frame);

    if(anim){
      var t = Math.min(1, (now - anim.t0)/anim.dur);
      var e = easeInOut(t);
      camera.position.lerpVectors(anim.fromCamPos, anim.toCamPos, e);
      currentLook.lerpVectors(anim.fromLook, anim.toLook, e);
      avatar.position.lerpVectors(anim.fromAvatar, anim.toAvatar, e);
      camera.lookAt(currentLook);
      if(t >= 1) anim = null;
    } else if(!activeDept && !prefersReducedMotion){
      var radius = OVERVIEW_POS.length();
      var baseAngle = Math.atan2(OVERVIEW_POS.z, OVERVIEW_POS.x) + overviewYaw;
      camera.position.x = Math.cos(baseAngle) * Math.sqrt(OVERVIEW_POS.x*OVERVIEW_POS.x + OVERVIEW_POS.z*OVERVIEW_POS.z);
      camera.position.z = Math.sin(baseAngle) * Math.sqrt(OVERVIEW_POS.x*OVERVIEW_POS.x + OVERVIEW_POS.z*OVERVIEW_POS.z);
      camera.position.y = OVERVIEW_POS.y;
      camera.lookAt(currentLook);
    } else if(activeDept){
      camera.lookAt(currentLook);
    }

    avatarRing.rotation.z += 0.01;

    for(var id in wallMats){
      var target = (activeDept && activeDept.id === id) ? 0.18 : 0.0;
      wallMats[id].emissiveIntensity += (target - wallMats[id].emissiveIntensity) * 0.12;
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

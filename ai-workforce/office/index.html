<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Studio Floor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#c9d3da;
    --ink:#1B2027;
    --muted:#5B6470;
    --panel-bg:rgba(255,255,255,0.92);
    --panel-border:rgba(27,32,39,0.12);
    --chip-bg:rgba(27,32,39,0.05);
    --shadow:0 24px 64px rgba(20,24,31,0.16);
    --a-strategy:#C97F22;
    --a-research:#1F9690;
    --a-content:#D24E64;
    --a-software:#3560CC;
    --a-sales:#2F9350;
    --a-delivery:#6E4FCC;
    --a-growth:#B33F94;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f141b;
      --ink:#ECEEF2;
      --muted:#98A1AE;
      --panel-bg:rgba(22,26,34,0.92);
      --panel-border:rgba(236,238,242,0.12);
      --chip-bg:rgba(236,238,242,0.06);
      --shadow:0 24px 64px rgba(0,0,0,0.55);
      --a-strategy:#E0A24A; --a-research:#3FC0B9; --a-content:#E67B8E;
      --a-software:#6C8FE8; --a-sales:#57BE79; --a-delivery:#9782E8; --a-growth:#D871BC;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f141b; --ink:#ECEEF2; --muted:#98A1AE;
    --panel-bg:rgba(22,26,34,0.92); --panel-border:rgba(236,238,242,0.12); --chip-bg:rgba(236,238,242,0.06);
    --shadow:0 24px 64px rgba(0,0,0,0.55);
    --a-strategy:#E0A24A; --a-research:#3FC0B9; --a-content:#E67B8E;
    --a-software:#6C8FE8; --a-sales:#57BE79; --a-delivery:#9782E8; --a-growth:#D871BC;
    color-scheme: dark;
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  *{box-sizing:border-box;}
  body{font-family:"Work Sans",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  #scene.dragging{cursor:grabbing;}
  #scene.hover{cursor:pointer;}

  #app{position:fixed;inset:0;pointer-events:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;justify-content:space-between;}

  header{pointer-events:auto;display:flex;flex-direction:column;gap:2px;max-width:min(420px,68vw);}
  header .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
  header h1{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:clamp(22px,3.4vw,32px);line-height:.95;margin:2px 0 0 0;}

  #hint{
    pointer-events:none;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
    background:var(--panel-bg);border:1px solid var(--panel-border);
    padding:7px 13px;border-radius:999px;box-shadow:var(--shadow);
    transition:opacity .5s ease;align-self:center;
  }
  #hint.hidden{opacity:0;}

  #bottomRow{display:flex;flex-direction:column;align-items:center;gap:12px;}
  #legend{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:680px;}
  #legend button{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;display:flex;align-items:center;gap:6px;
    background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--ink);
    padding:6px 10px 6px 8px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  #legend button .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  #legend button.active{outline:2px solid var(--ink);outline-offset:1px;}

  #minimap{
    pointer-events:none;position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;
    background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);
    backdrop-filter:blur(10px);padding:6px;
  }

  #panel{
    position:fixed;top:0;right:0;height:100%;width:min(360px,100%);
    background:var(--panel-bg);border-left:1px solid var(--panel-border);backdrop-filter:blur(14px);box-shadow:var(--shadow);
    transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
    padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px)) 22px;
    overflow-y:auto;pointer-events:auto;
  }
  #panel.open{transform:translateX(0);}
  #panel .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  #panel .bar{width:36px;height:5px;border-radius:99px;margin-bottom:14px;}
  #panelClose{
    pointer-events:auto;background:var(--chip-bg);border:1px solid var(--panel-border);color:var(--muted);
    width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex:none;
  }
  #panel .code{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.1em;}
  #panel h2{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:27px;line-height:1;margin:5px 0 4px 0;}
  #panel .role{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  #panel .agents{display:flex;flex-direction:column;gap:9px;}
  .agent-card{background:var(--chip-bg);border:1px solid var(--panel-border);border-radius:11px;padding:11px 13px;}
  .agent-card .name{font-weight:600;font-size:13.5px;margin-bottom:3px;}
  .agent-card .desc{font-size:12px;color:var(--muted);line-height:1.42;}
  .status-line{display:flex;align-items:center;gap:6px;margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);}
  .status-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .task-line{font-size:12px;font-style:italic;color:var(--ink);margin-top:5px;line-height:1.4;}
  .result-line{font-style:normal;color:var(--muted);}
  .assign-row{display:flex;gap:6px;margin-top:9px;}
  .assign-row input{
    flex:1;min-width:0;font-family:"Work Sans",sans-serif;font-size:12px;
    background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:7px;
    padding:6px 8px;color:var(--ink);
  }
  .assign-row button{
    font-family:"Work Sans",sans-serif;font-weight:600;font-size:12px;
    background:var(--ink);color:var(--bg);border:none;border-radius:7px;padding:6px 12px;cursor:pointer;flex:none;
  }
  .assign-row button:disabled{opacity:0.5;cursor:default;}
  .assign-msg{font-size:10.5px;color:var(--muted);margin-top:4px;min-height:13px;}

  @media (max-width:720px){
    #panel{top:auto;bottom:0;right:0;left:0;width:100%;height:min(56vh,480px);border-left:none;border-top:1px solid var(--panel-border);border-radius:18px 18px 0 0;transform:translateY(105%);}
    #panel.open{transform:translateY(0);}
    #legend{max-width:100%;}
    header{max-width:74vw;}
    #minimap{transform:scale(.82);transform-origin:top right;}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="app">
  <header>
    <span class="eyebrow">35 agents &middot; 7 departments</span>
    <h1>The Studio Floor</h1>
  </header>

  <div id="bottomRow">
    <div id="hint">drag to orbit &middot; scroll / pinch to zoom &middot; right-drag to pan &middot; click a pod</div>
    <div id="legend"></div>
  </div>
</div>

<canvas id="minimap" width="150" height="104"></canvas>

<div id="panel">
  <div class="topline">
    <div class="bar" id="panelBar"></div>
    <button id="panelClose" type="button" aria-label="Close">&#10005;</button>
  </div>
  <div class="code" id="panelCode"></div>
  <h2 id="panelTitle"></h2>
  <div class="role" id="panelSub"></div>
  <div class="agents" id="panelAgents"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------- data ----------------
  var DEPARTMENTS = [
    { id:"strategy", code:"00", name:"Strategy & Operations", tag:"Runs the studio itself", cssVar:"--a-strategy", hex:0xC97F22, x:0, z:-2.5, boardroom:true,
      agents:[
        {name:"Chief of Staff", desc:"Prioritizes the studio's work queue, tracks capacity across all 35 agents."},
        {name:"Project Manager", desc:"Breaks a signed job into tasks and assigns them to the right department."},
        {name:"Finance & Bookkeeping Agent", desc:"Tracks invoices sent/paid, expenses, and margin per job."},
        {name:"Contract & Proposal Drafting Agent", desc:"Drafts SOWs, contracts, and NDAs from templates."},
        {name:"Quality Bar Agent", desc:"Reviews every deliverable against the client brief before it ships."}
      ]},
    { id:"research", code:"01", name:"Research & Intelligence", tag:"Finds the opportunities", cssVar:"--a-research", hex:0x1F9690, x:-11, z:-7,
      agents:[
        {name:"Opportunity Scout", desc:"Scans for underserved niches and side-hustle categories worth entering."},
        {name:"Market Research Agent", desc:"Sizes a market: demand signals, pricing norms, buyer pain points."},
        {name:"Competitor Analysis Agent", desc:"Profiles competitors for a given niche or client."},
        {name:"Client / Lead Researcher", desc:"Builds a one-page dossier on a prospect before outreach."},
        {name:"Trend Scout", desc:"Tracks emerging tools, platforms, and demand shifts."}
      ]},
    { id:"content", code:"02", name:"Content & Creative", tag:"Writes and designs", cssVar:"--a-content", hex:0xD24E64, x:11, z:-7,
      agents:[
        {name:"Copywriter", desc:"Website, landing page, and ad copy."},
        {name:"SEO / Blog Writer", desc:"Long-form articles and SEO content."},
        {name:"Social Media Agent", desc:"Platform-native posts and a content calendar."},
        {name:"Video / Podcast Script Agent", desc:"Scripts and outlines for video or audio content."},
        {name:"Brand & Graphic Design Agent", desc:"Brand guides, simple graphics, and slide decks."}
      ]},
    { id:"software", code:"03", name:"Software & Technical", tag:"Builds the deliverable", cssVar:"--a-software", hex:0x3560CC, x:11, z:0,
      agents:[
        {name:"Full-Stack Dev Agent", desc:"Builds websites, small apps, and integrations."},
        {name:"Automation / Scripting Agent", desc:"Builds workflow automations that save a client real hours."},
        {name:"Data Analyst Agent", desc:"Cleans data and builds dashboards or reports."},
        {name:"QA / Testing Agent", desc:"Tests everything before it ships."},
        {name:"DevOps / Deployment Agent", desc:"Handles hosting, deployment, and uptime monitoring."}
      ]},
    { id:"sales", code:"04", name:"Sales & Client Acquisition", tag:"Turns leads into signed jobs", cssVar:"--a-sales", hex:0x2F9350, x:11, z:7,
      agents:[
        {name:"Outreach / Cold Email Agent", desc:"Drafts personalized outreach at volume — never sends without approval."},
        {name:"Proposal Writer", desc:"Turns a scoped opportunity into a priced proposal."},
        {name:"Sales Call Prep Agent", desc:"Preps talking points, objections, and pricing anchors."},
        {name:"CRM / Pipeline Manager Agent", desc:"Tracks every lead's stage and next action."},
        {name:"Partnerships Agent", desc:"Finds agencies and platforms worth partnering with."}
      ]},
    { id:"delivery", code:"05", name:"Client Delivery & Support", tag:"Keeps clients happy", cssVar:"--a-delivery", hex:0x6E4FCC, x:-11, z:7,
      agents:[
        {name:"Onboarding Agent", desc:"Turns a signed deal into a kickoff packet and intake form."},
        {name:"Account Manager Agent", desc:"Owns the client relationship day-to-day."},
        {name:"Support / Help Desk Agent", desc:"Answers routine client questions and triages issues."},
        {name:"Deliverable QA Reviewer", desc:"Final check that what's shipping matches what was promised."},
        {name:"Documentation Agent", desc:"Writes handoff docs, SOPs, and how-to guides."}
      ]},
    { id:"growth", code:"06", name:"Growth & Marketing", tag:"Builds inbound demand", cssVar:"--a-growth", hex:0xB33F94, x:-11, z:0,
      agents:[
        {name:"SEO Agent", desc:"Keyword strategy and on-page SEO."},
        {name:"Paid Ads Agent", desc:"Drafts ad copy, targeting, and budget plans."},
        {name:"Email Marketing Agent", desc:"Builds nurture sequences and newsletters."},
        {name:"Community / Engagement Agent", desc:"Drafts engagement content for communities and forums."},
        {name:"Analytics / Reporting Agent", desc:"Tracks what's actually converting across the studio."}
      ]}
  ];

  function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
  DEPARTMENTS.forEach(function(d){ d.agents.forEach(function(a){ a.id = slugify(a.name); a.dept = d.id; }); });

  var BUILD_HX = 16.2, BUILD_HZ = 11.2, WALL_T = 0.3, WALL_H = 4.3;

  // ---------------- renderer / scene ----------------
  var canvas = document.getElementById("scene");
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  function readBG(){
    try{
      var v = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      return parseInt(v.replace("#",""),16);
    }catch(e){ return 0xc9d3da; }
  }
  renderer.setClearColor(readBG(), 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.05, 200);

  function resize(){
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener("resize", resize);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4235, 0.8));
  var sun = new THREE.DirectionalLight(0xfff4e0, 0.95);
  sun.position.set(12, 18, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1536,1536);
  sun.shadow.camera.left=-20; sun.shadow.camera.right=20; sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
  sun.shadow.camera.far = 46;
  sun.shadow.bias = -0.0009;
  scene.add(sun);

  // ---------------- textures ----------------
  function canvasTex(draw, w, h, rx, ry){
    var c = document.createElement("canvas"); c.width=w; c.height=h;
    draw(c.getContext("2d"), w, h);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx||1, ry||1);
    t.anisotropy = 4;
    return t;
  }

  var brickTex = canvasTex(function(ctx,w,h){
    ctx.fillStyle = "#8a4a3a"; ctx.fillRect(0,0,w,h);
    var bw=32, bh=16, mortar=2;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for(var y=0;y<h;y+=bh){
      var offset = (Math.round(y/bh)%2===0) ? 0 : bw/2;
      for(var x=-bw;x<w+bw;x+=bw){
        ctx.fillRect(x+offset, y, mortar, bh);
      }
      ctx.fillRect(0,y,w,mortar);
    }
    for(var i=0;i<900;i++){
      ctx.fillStyle = "rgba(0,0,0,"+(Math.random()*0.08)+")";
      ctx.fillRect(Math.random()*w, Math.random()*h, 2,2);
    }
  }, 256,128, 6, 1.4);

  var woodTex = canvasTex(function(ctx,w,h){
    var planks = 10, pw = w/planks;
    for(var i=0;i<planks;i++){
      var shade = 96 + Math.round(Math.sin(i*12.9)*10) + (i%2===0?6:0);
      ctx.fillStyle = "rgb("+(shade+30)+","+(shade+8)+","+(shade-18<0?0:shade-18)+")";
      ctx.fillRect(i*pw,0,pw,h);
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      ctx.fillRect(i*pw,0,2,h);
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      for(var g=0;g<h;g+=6) ctx.fillRect(i*pw+4, g, pw-8, 1);
    }
  }, 128,128, 10, 10);

  var skyTex = canvasTex(function(ctx,w,h){
    var g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, "#bcd9ee"); g.addColorStop(1, "#e9f3e6");
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "rgba(90,140,90,0.55)";
    for(var i=0;i<5;i++){
      var cx = (i+0.5)*(w/5), cy = h*0.72;
      ctx.beginPath(); ctx.ellipse(cx, cy, 46,58,0,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath(); ctx.arc(w*0.78, h*0.22, 20, 0, Math.PI*2); ctx.fill();
  }, 128,128, 1,1);

  var screenTex = canvasTex(function(ctx,w,h){
    ctx.fillStyle = "#0c1420"; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = "rgba(120,190,255,0.85)"; ctx.lineWidth = 3;
    ctx.beginPath();
    var pts=[10,70,40,50,70,80,100,30,118,55];
    for(var i=0;i<pts.length;i+=2){ if(i===0) ctx.moveTo(pts[i],h-pts[i+1]); else ctx.lineTo(pts[i],h-pts[i+1]); }
    ctx.stroke();
    ctx.fillStyle="rgba(120,190,255,0.5)";
    for(var b=0;b<5;b++) ctx.fillRect(8+b*22, h-14, 14, 10);
  }, 128,80,1,1);

  var badgeTex = canvasTex(function(ctx,w,h){
    ctx.beginPath(); ctx.arc(w/2,h/2,w/2-2,0,Math.PI*2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.stroke();
  }, 32,32,1,1);

  // live per-agent status, filled in by the db subscription below
  var agentMeshes = {};   // agentId -> {mat: SpriteMaterial}
  var agentStatus = {};   // agentId -> {status, task, result, updatedAt}
  var STATUS_COLOR = {idle:0x9aa3ae, requested:0xE0A24A, working:0x3FA35E, done:0x3560CC, blocked:0xD24E64};
  function statusOf(id){ return (agentStatus[id] && agentStatus[id].status) || "idle"; }
  function updateBadge(id){
    var m = agentMeshes[id];
    if(m) m.mat.color.setHex(STATUS_COLOR[statusOf(id)] || STATUS_COLOR.idle);
  }

  // ---------------- clickable zones (dept bounding rects) ----------------
  var zones = [];
  function registerZone(dept,minX,maxX,minZ,maxZ){ zones.push({dept:dept,minX:minX,maxX:maxX,minZ:minZ,maxZ:maxZ}); }
  function zoneAtPoint(x,z){
    for(var i=0;i<zones.length;i++){
      var zn = zones[i];
      if(x>=zn.minX && x<=zn.maxX && z>=zn.minZ && z<=zn.maxZ) return zn.dept;
    }
    return null;
  }

  // ---------------- materials ----------------
  var brickMat = new THREE.MeshStandardMaterial({map:brickTex, roughness:0.92});
  var woodMat = new THREE.MeshStandardMaterial({map:woodTex, roughness:0.34, metalness:0.06});
  var trussMat = new THREE.MeshStandardMaterial({color:0x23262c, roughness:0.55, metalness:0.35});
  var glassMat = new THREE.MeshPhysicalMaterial({color:0xdfeaf2, transparent:true, opacity:0.16, roughness:0.05, metalness:0, side:THREE.DoubleSide});
  var frameMat = new THREE.MeshStandardMaterial({color:0x20242b, roughness:0.5, metalness:0.4});
  var chairSeatMat = new THREE.MeshStandardMaterial({color:0xf1efe9, roughness:0.55});
  var chairFrameMat = new THREE.MeshStandardMaterial({color:0x2b2e34, roughness:0.4, metalness:0.5});
  var deskTopMat = new THREE.MeshStandardMaterial({color:0xf4f1ea, roughness:0.45});
  var deskLegMat = new THREE.MeshStandardMaterial({color:0xd8d3c8, roughness:0.5});
  var monitorMat = new THREE.MeshStandardMaterial({color:0x14161a, roughness:0.3});

  // ---------------- building shell ----------------
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(BUILD_HX*2, BUILD_HZ*2), woodMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  function wallBox(w,h,d,x,y,z,mat){
    var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    return m;
  }
  wallBox(BUILD_HX*2, WALL_H, WALL_T, 0, WALL_H/2, -BUILD_HZ, brickMat);
  wallBox(BUILD_HX*2, WALL_H, WALL_T, 0, WALL_H/2, BUILD_HZ, brickMat);
  wallBox(WALL_T, WALL_H, BUILD_HZ*2, -BUILD_HX, WALL_H/2, 0, brickMat);
  wallBox(WALL_T, WALL_H, BUILD_HZ*2, BUILD_HX, WALL_H/2, 0, brickMat);

  function windowUnit(x,z,rotY){
    var g = new THREE.Group();
    g.position.set(x,0,z); g.rotation.y = rotY;
    var pane = new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.1), new THREE.MeshBasicMaterial({map:skyTex}));
    pane.position.set(0, 2.15, 0);
    g.add(pane);
    var frameParts = [
      [2.7,0.12,0.08, 0,3.15,0],[2.7,0.12,0.08, 0,1.15,0],
      [0.1,2.1,0.08, -1.32,2.15,0],[0.1,2.1,0.08, 1.32,2.15,0],
      [0.06,2.1,0.08, 0,2.15,0]
    ];
    frameParts.forEach(function(p){
      var m = new THREE.Mesh(new THREE.BoxGeometry(p[0],p[1],p[2]), frameMat);
      m.position.set(p[3],p[4],p[5]); g.add(m);
    });
    scene.add(g);
  }
  [-7,0,7].forEach(function(zz){ windowUnit(-BUILD_HX+0.02, zz, Math.PI/2); windowUnit(BUILD_HX-0.02, zz, -Math.PI/2); });
  [-6,6].forEach(function(xx){ windowUnit(xx, -BUILD_HZ+0.02, 0); });

  var pendantPositions = [];
  for(var tz=-8; tz<=8; tz+=4){
    var beam = new THREE.Mesh(new THREE.BoxGeometry(BUILD_HX*2-0.4, 0.22, 0.28), trussMat);
    beam.position.set(0, WALL_H-0.05, tz);
    beam.castShadow = true;
    scene.add(beam);

  function makeSign(text, y, z_offset){
    var scale = 4;
    var c = document.createElement("canvas");
    var ctx = c.getContext("2d");
    var font = "700 " + (28*scale) + "px 'Big Shoulders Display', sans-serif";
    ctx.font = font;
    var padX = 22*scale;
    var w = Math.ceil(ctx.measureText(text.toUpperCase()).width) + padX*2;
    var h = 54*scale;
    c.width=w; c.height=h;
    ctx = c.getContext("2d");
    ctx.font = font;
    ctx.fillStyle = "rgba(20,20,20,0.001)"; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "#ffffff";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.letterSpacing = (1.5*scale)+"px";
    ctx.fillText(text.toUpperCase(), w/2, h/2+2*scale);
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
    var sprite = new THREE.Sprite(mat);
    var worldH = 0.62;
    sprite.scale.set(worldH*(w/h), worldH, 1);
    sprite.position.set(0, y, z_offset||0);
    return sprite;
  }

  // ---------------- orbit camera (full manual control) ----------------
  var orbit = { target:new THREE.Vector3(0,0.4,0), radius:27, theta:0.55, phi:0.82 };
  var MIN_R=3.2, MAX_R=42, MIN_PHI=0.12, MAX_PHI=1.52;
  var PAN_HX = BUILD_HX-0.5, PAN_HZ = BUILD_HZ-0.5;

  function applyOrbit(){
    var st = Math.sin(orbit.phi);
    camera.position.set(
      orbit.target.x + orbit.radius*st*Math.sin(orbit.theta),
      orbit.target.y + orbit.radius*Math.cos(orbit.phi),
      orbit.target.z + orbit.radius*st*Math.cos(orbit.theta)
    );
    camera.lookAt(orbit.target);
  }
  applyOrbit();

  var orbitAnim = null;
  function focusOn(dept){
    orbitAnim = {
      t0: performance.now(), dur: prefersReducedMotion?1:750,
      fromTarget: orbit.target.clone(), toTarget: new THREE.Vector3(dept.x, 0.4, dept.z),
      fromRadius: orbit.radius, toRadius: dept.boardroom ? 13 : 9,
      fromPhi: orbit.phi, toPhi: 0.72
    };
    openPanel(dept);
    updateLegendActive(dept);
  }

  // ---------------- pointer controls ----------------
  var pointers = new Map();
  var twoFinger = null;
  var downInfo = null;
  var userInteracted = false;
  var raycaster = new THREE.Raycaster();

  function ndcFrom(x,y){ return { x:(x/innerWidth)*2-1, y:-(y/innerHeight)*2+1 }; }

  function doRotate(dx,dy){
    orbit.theta -= dx*0.0052;
    orbit.phi -= dy*0.0052;
    orbit.phi = Math.max(MIN_PHI, Math.min(MAX_PHI, orbit.phi));
  }
  function doPan(dx,dy){
    var s = orbit.radius*0.0016;
    var rx = Math.cos(orbit.theta), rz = -Math.sin(orbit.theta);
    var fx = Math.sin(orbit.theta), fz = Math.cos(orbit.theta);
    orbit.target.x -= (rx*dx - fx*dy)*s;
    orbit.target.z -= (rz*dx - fz*dy)*s;
    orbit.target.x = Math.max(-PAN_HX, Math.min(PAN_HX, orbit.target.x));
    orbit.target.z = Math.max(-PAN_HZ, Math.min(PAN_HZ, orbit.target.z));
  }
  function doZoom(factor){
    orbit.radius = Math.max(MIN_R, Math.min(MAX_R, orbit.radius*factor));
  }

  canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  canvas.addEventListener("pointerdown", function(e){
    userInteracted = true;
    orbitAnim = null;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY, button:e.button});
    canvas.classList.add("dragging");
    if(pointers.size === 1){
      downInfo = {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now(), moved:false, button:e.button};
    } else {
      if(downInfo) downInfo.moved = true;
      twoFinger = null;
    }
  });

  canvas.addEventListener("pointermove", function(e){
    if(!pointers.has(e.pointerId)){
      // hover cursor feedback when not dragging
      if(pointers.size===0){
        var ndc = ndcFrom(e.clientX,e.clientY);
        raycaster.setFromCamera(ndc, camera);
        var hit = raycaster.intersectObject(floor)[0];
        canvas.classList.toggle("hover", !!(hit && zoneAtPoint(hit.point.x, hit.point.z)));
      }
      return;
    }
    var entry = pointers.get(e.pointerId);
    var dx = e.clientX - entry.x, dy = e.clientY - entry.y;
    entry.x = e.clientX; entry.y = e.clientY;

    if(downInfo && downInfo.id===e.pointerId){
      if(Math.hypot(e.clientX-downInfo.x, e.clientY-downInfo.y) > 6) downInfo.moved = true;
    }

    if(pointers.size === 1){
      if(entry.button === 2) doPan(dx,dy); else doRotate(dx,dy);
    } else if(pointers.size === 2){
      var pts = Array.from(pointers.values());
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      var midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
      if(twoFinger){
        if(twoFinger.prevDist > 1) doZoom(twoFinger.prevDist/dist);
        doPan(midX-twoFinger.prevMidX, midY-twoFinger.prevMidY);
      }
      twoFinger = {prevDist:dist, prevMidX:midX, prevMidY:midY};
    }
  });

  function endPointer(e){
    var wasDown = downInfo && downInfo.id===e.pointerId;
    pointers.delete(e.pointerId);
    if(pointers.size < 2) twoFinger = null;
    if(pointers.size === 0) canvas.classList.remove("dragging");
    if(wasDown){
      if(!downInfo.moved && downInfo.button!==2 && (performance.now()-downInfo.t)<400){
        var ndc = ndcFrom(downInfo.x, downInfo.y);
        raycaster.setFromCamera(ndc, camera);
        var hit = raycaster.intersectObject(floor)[0];
        if(hit){
          var dept = zoneAtPoint(hit.point.x, hit.point.z);
          if(dept) focusOn(dept);
        }
      }
      downInfo = null;
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    userInteracted = true;
    orbitAnim = null;
    doZoom(1 + e.deltaY*0.0012);
  }, {passive:false});

  // ---------------- panel ----------------
  var panel = document.getElementById("panel");

  var STATUS_LABEL = {idle:"Idle — no task assigned", requested:"Requested, not started", working:"Working", done:"Done", blocked:"Blocked"};

  function assignTask(agentId, inputEl, btnEl, msgEl){
    if(!agentsCol){ msgEl.textContent = "Live status isn't connected in this view."; return; }
    var text = inputEl.value.trim();
    if(!text) return;
    btnEl.disabled = true; inputEl.disabled = true;
    msgEl.textContent = "Saving…";
    agentsCol.doc(agentId).update({status:"requested", task:text, updatedAt:new Date().toISOString()})
      .then(function(){
        inputEl.value = ""; msgEl.textContent = "";
      })
      .catch(function(err){
        msgEl.textContent = (err && err.code==="invalid_argument") ? "You don't have edit access here." : "Couldn't save — try again.";
      })
      .then(function(){ btnEl.disabled = false; inputEl.disabled = false; });
  }

  function openPanel(dept){
    currentDept = dept;
    document.getElementById("panelBar").style.background = "var("+dept.cssVar+")";
    document.getElementById("panelCode").textContent = "ROOM "+dept.code;
    document.getElementById("panelTitle").textContent = dept.name;
    document.getElementById("panelSub").textContent = dept.tag+" · "+dept.agents.length+" agents";
    var wrap = document.getElementById("panelAgents");
    wrap.innerHTML = "";
    dept.agents.forEach(function(a){
      var live = agentStatus[a.id];
      var status = (live && live.status) || "idle";

      var el = document.createElement("div"); el.className="agent-card";
      var n = document.createElement("div"); n.className="name"; n.textContent=a.name;
      var de = document.createElement("div"); de.className="desc"; de.textContent=a.desc;

      var st = document.createElement("div"); st.className="status-line";
      var dot = document.createElement("span"); dot.className="status-dot"; dot.style.background = "#"+(STATUS_COLOR[status]||STATUS_COLOR.idle).toString(16).padStart(6,"0");
      var stText = document.createElement("span");
      stText.textContent = STATUS_LABEL[status] || status;
      st.appendChild(dot); st.appendChild(stText);
      el.appendChild(n); el.appendChild(de); el.appendChild(st);

      if(live && live.task){
        var taskLine = document.createElement("div"); taskLine.className="task-line";
        taskLine.textContent = "“"+live.task+"”";
        el.appendChild(taskLine);
      }
      if(live && live.result){
        var resultLine = document.createElement("div"); resultLine.className="task-line result-line";
        resultLine.textContent = live.result;
        el.appendChild(resultLine);
      }

      var row = document.createElement("div"); row.className="assign-row";
      var input = document.createElement("input"); input.type="text"; input.placeholder="Assign a task…"; input.maxLength=200;
      var btn = document.createElement("button"); btn.type="button"; btn.textContent="Assign";
      var msg = document.createElement("div"); msg.className="assign-msg";
      row.appendChild(input); row.appendChild(btn);
      el.appendChild(row); el.appendChild(msg);
      btn.addEventListener("click", function(){ assignTask(a.id, input, btn, msg); });
      input.addEventListener("keydown", function(e){ if(e.key==="Enter") assignTask(a.id, input, btn, msg); });

      wrap.appendChild(el);
    });
    panel.classList.add("open");
    document.getElementById("hint").classList.add("hidden");
  }
  function refreshPanelIfOpen(){
    if(panel.classList.contains("open") && currentDept) openPanel(currentDept);
  }
  document.getElementById("panelClose").addEventListener("click", function(){
    panel.classList.remove("open");
    currentDept = null;
    Array.prototype.forEach.call(legend.children, function(btn){ btn.classList.remove("active"); });
  });

  // ---------------- live agent status (db capability) ----------------
  var agentsCol = null;
  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(db){
      if(!db) return;
      agentsCol = db.collection("agents");
      agentsCol.onSnapshot(function(snap){
        snap.docs.forEach(function(doc){
          agentStatus[doc.id] = doc.data();
          updateBadge(doc.id);
        });
        refreshPanelIfOpen();
      }, function(){ /* live status unavailable in this view; badges stay idle-grey */ });
    }).catch(function(){});
  }

  // ---------------- minimap ----------------
  var mmCanvas = document.getElementById("minimap");
  var mmCtx = mmCanvas.getContext("2d");
  var mmScale = 132/(BUILD_HX*2);
  function drawMinimap(){
    var w=mmCanvas.width,h=mmCanvas.height;
    mmCtx.clearRect(0,0,w,h);
    mmCtx.fillStyle = "rgba(120,120,120,0.18)";
    mmCtx.fillRect(9,9,BUILD_HX*2*mmScale, BUILD_HZ*2*mmScale);
    DEPARTMENTS.forEach(function(d){
      var hw=(d.boardroom?4.6:2.2), hd=(d.boardroom?3.1:1.5);
      mmCtx.fillStyle = "#"+d.hex.toString(16).padStart(6,"0");
      mmCtx.globalAlpha = 0.85;
      mmCtx.fillRect(9+(d.x+BUILD_HX-hw)*mmScale, 9+(d.z+BUILD_HZ-hd)*mmScale, hw*2*mmScale, hd*2*mmScale);
      mmCtx.globalAlpha = 1;
    });
    var tx = 9+(orbit.target.x+BUILD_HX)*mmScale, tz = 9+(orbit.target.z+BUILD_HZ)*mmScale;
    var camX = 9+(camera.position.x+BUILD_HX)*mmScale, camZ = 9+(camera.position.z+BUILD_HZ)*mmScale;
    mmCtx.strokeStyle = "rgba(27,32,39,0.55)"; mmCtx.lineWidth = 1.5;
    mmCtx.beginPath(); mmCtx.moveTo(tx,tz); mmCtx.lineTo(camX,camZ); mmCtx.stroke();
    mmCtx.fillStyle = "#1B2027";
    mmCtx.beginPath(); mmCtx.arc(tx,tz,4,0,Math.PI*2); mmCtx.fill();
  }

  // ---------------- main loop ----------------
  var clock = new THREE.Clock();
  var elapsed = 0;
  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function frame(){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, clock.getDelta());
    elapsed += dt;

    if(!prefersReducedMotion){
      people.forEach(function(p){
        p.group.position.y = Math.sin(elapsed*1.6+p.phase)*0.012;
        p.group.rotation.y = p.baseRotY + Math.sin(elapsed*0.7+p.phase)*0.07;
      });
      walkers.forEach(function(w){
        w.t += w.dir*dt*w.speed;
        if(w.t>1){ w.t=1; w.dir=-1; }
        if(w.t<0){ w.t=0; w.dir=1; }
        var x = w.a.x+(w.b.x-w.a.x)*w.t, z = w.a.z+(w.b.z-w.a.z)*w.t;
        var facing = Math.atan2(w.b.x-w.a.x, w.b.z-w.a.z) + (w.dir<0?Math.PI:0);
        w.group.position.set(x, Math.abs(Math.sin(elapsed*8))*0.035, z);
        w.group.rotation.y = facing;
      });
    }

    if(orbitAnim){
      var t = Math.min(1, (performance.now()-orbitAnim.t0)/orbitAnim.dur);
      var e = easeInOut(t);
      orbit.target.lerpVectors(orbitAnim.fromTarget, orbitAnim.toTarget, e);
      orbit.radius = orbitAnim.fromRadius + (orbitAnim.toRadius-orbitAnim.fromRadius)*e;
      orbit.phi = orbitAnim.fromPhi + (orbitAnim.toPhi-orbitAnim.fromPhi)*e;
      if(t>=1) orbitAnim = null;
    } else if(!userInteracted && !prefersReducedMotion){
      orbit.theta += dt*0.06;
    }

    applyOrbit();
    drawMinimap();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

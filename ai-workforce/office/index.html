<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Studio Floor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#c9d3da;
    --ink:#1B2027;
    --muted:#5B6470;
    --panel-bg:rgba(255,255,255,0.92);
    --panel-border:rgba(27,32,39,0.12);
    --chip-bg:rgba(27,32,39,0.05);
    --shadow:0 24px 64px rgba(20,24,31,0.16);
    --a-strategy:#C97F22;
    --a-research:#1F9690;
    --a-content:#D24E64;
    --a-software:#3560CC;
    --a-sales:#2F9350;
    --a-delivery:#6E4FCC;
    --a-growth:#B33F94;
    --a-lasttouch:#B8901E;
    --status-sent:#3560CC;
    --status-paid:#2F9350;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f141b;
      --ink:#ECEEF2;
      --muted:#98A1AE;
      --panel-bg:rgba(22,26,34,0.92);
      --panel-border:rgba(236,238,242,0.12);
      --chip-bg:rgba(236,238,242,0.06);
      --shadow:0 24px 64px rgba(0,0,0,0.55);
      --a-strategy:#E0A24A; --a-research:#3FC0B9; --a-content:#E67B8E;
      --a-software:#6C8FE8; --a-sales:#57BE79; --a-delivery:#9782E8; --a-growth:#D871BC;
      --a-lasttouch:#DCB24E;
      --status-sent:#6C8FE8; --status-paid:#57BE79;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f141b; --ink:#ECEEF2; --muted:#98A1AE;
    --panel-bg:rgba(22,26,34,0.92); --panel-border:rgba(236,238,242,0.12); --chip-bg:rgba(236,238,242,0.06);
    --shadow:0 24px 64px rgba(0,0,0,0.55);
    --a-strategy:#E0A24A; --a-research:#3FC0B9; --a-content:#E67B8E;
    --a-software:#6C8FE8; --a-sales:#57BE79; --a-delivery:#9782E8; --a-growth:#D871BC;
    --a-lasttouch:#DCB24E;
    --status-sent:#6C8FE8; --status-paid:#57BE79;
    color-scheme: dark;
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  *{box-sizing:border-box;}
  body{font-family:"Work Sans",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  #scene.dragging{cursor:grabbing;}
  #scene.hover{cursor:pointer;}

  #app{position:fixed;inset:0;pointer-events:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;justify-content:space-between;}

  #topRow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  header{pointer-events:auto;display:flex;flex-direction:column;gap:2px;max-width:min(420px,52vw);}
  header .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
  header h1{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:clamp(22px,3.4vw,32px);line-height:.95;margin:2px 0 0 0;}

  #topBtns{display:flex;gap:8px;pointer-events:auto;}
  .pillbtn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--ink);
    font-family:"Work Sans",sans-serif;font-weight:600;font-size:12.5px;
    padding:9px 13px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  .pillbtn:active{transform:scale(.97);}

  #hint{
    pointer-events:none;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
    background:var(--panel-bg);border:1px solid var(--panel-border);
    padding:7px 13px;border-radius:999px;box-shadow:var(--shadow);
    transition:opacity .5s ease;align-self:center;
  }
  #hint.hidden{opacity:0;}

  #bottomRow{display:flex;flex-direction:column;align-items:center;gap:12px;}
  #legend{
    pointer-events:auto;display:flex;flex-wrap:nowrap;gap:5px;
    max-width:min(720px,92vw);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;padding:2px 3px;
    -webkit-mask-image:linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
  }
  #legend::-webkit-scrollbar{display:none;}
  #legend button{
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap;
    background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--ink);
    padding:5px 9px 5px 7px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  #legend button .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  #legend button.active{outline:2px solid var(--ink);outline-offset:1px;}

  #panel{
    position:fixed;top:0;right:0;height:100%;width:min(360px,100%);
    background:var(--panel-bg);border-left:1px solid var(--panel-border);backdrop-filter:blur(14px);box-shadow:var(--shadow);
    transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
    padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px)) 22px;
    overflow-y:auto;pointer-events:auto;
  }
  #panel.open{transform:translateX(0);}
  #panel .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  #panel .bar{width:36px;height:5px;border-radius:99px;margin-bottom:14px;}
  #panelClose{
    pointer-events:auto;background:var(--chip-bg);border:1px solid var(--panel-border);color:var(--muted);
    width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex:none;
  }
  #panelBack{
    pointer-events:auto;background:none;border:none;color:var(--muted);
    font-family:"Work Sans",sans-serif;font-weight:600;font-size:12px;cursor:pointer;padding:0 0 10px 0;
  }
  #panelBack:hover{color:var(--ink);}
  .next-line{font-size:12px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--panel-border);line-height:1.4;}
  .next-line b{color:var(--ink);font-weight:600;}
  #panel .code{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.1em;}
  #panel h2{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:27px;line-height:1;margin:5px 0 4px 0;}
  #panel .role{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  #panel .agents{display:flex;flex-direction:column;gap:9px;}
  .agent-card{background:var(--chip-bg);border:1px solid var(--panel-border);border-radius:11px;padding:11px 13px;}
  .agent-card .name{font-weight:600;font-size:13.5px;margin-bottom:3px;}
  .agent-card .desc{font-size:12px;color:var(--muted);line-height:1.42;}
  .status-line{display:flex;align-items:center;gap:6px;margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);}
  .status-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .task-line{font-size:12px;font-style:italic;color:var(--ink);margin-top:5px;line-height:1.4;}
  .result-line{font-style:normal;color:var(--muted);}
  .assign-row{display:flex;gap:6px;margin-top:9px;}
  .assign-row input{
    flex:1;min-width:0;font-family:"Work Sans",sans-serif;font-size:12px;
    background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:7px;
    padding:6px 8px;color:var(--ink);
  }
  .assign-row button{
    font-family:"Work Sans",sans-serif;font-weight:600;font-size:12px;
    background:var(--ink);color:var(--bg);border:none;border-radius:7px;padding:6px 12px;cursor:pointer;flex:none;
  }
  .assign-row button:disabled{opacity:0.5;cursor:default;}
  .assign-msg{font-size:10.5px;color:var(--muted);margin-top:4px;min-height:13px;}

  #rosterOverlay{
    position:fixed;inset:0;background:rgba(10,12,16,0.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:20;
  }
  #rosterOverlay.open{opacity:1;pointer-events:auto;}
  #rosterSheet{
    width:min(760px,100%);height:min(82vh,780px);background:var(--panel-bg);border:1px solid var(--panel-border);
    border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px);display:flex;flex-direction:column;overflow:hidden;
  }
  #rosterHead{padding:20px 22px 14px;border-bottom:1px solid var(--panel-border);flex:none;}
  #rosterHead .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  #rosterHead h2{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:24px;margin:0;}
  #rosterHead .sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:"IBM Plex Mono",monospace;}
  #rosterClose{
    background:var(--chip-bg);border:1px solid var(--panel-border);color:var(--muted);
    width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex:none;
  }
  #rosterSearch{
    margin-top:12px;width:100%;font-family:"Work Sans",sans-serif;font-size:13px;
    background:var(--chip-bg);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 12px;color:var(--ink);
  }
  #rosterList{flex:1;overflow-y:auto;padding:8px 14px 18px;}
  .roster-dept{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px;}
  .roster-row{
    display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;
  }
  .roster-row:hover{background:var(--chip-bg);}
  .roster-row .rdot{width:8px;height:8px;border-radius:50%;flex:none;}
  .roster-row .rname{font-weight:600;font-size:13px;flex:none;width:180px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roster-row .rmeta{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roster-row .rstatus{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);flex:none;}
  .roster-empty{padding:30px 8px;text-align:center;color:var(--muted);font-size:13px;}

  #commandOverlay{
    position:fixed;inset:0;background:rgba(10,12,16,0.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:20;
  }
  #commandOverlay.open{opacity:1;pointer-events:auto;}
  #commandSheet{
    width:min(820px,100%);height:min(82vh,780px);background:var(--panel-bg);border:1px solid var(--panel-border);
    border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px);display:flex;flex-direction:column;overflow:hidden;
  }
  #commandHead{padding:20px 22px 16px;border-bottom:1px solid var(--panel-border);flex:none;}
  #commandHead .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  #commandHead h2{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:24px;margin:0;}
  #commandHead .sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:"IBM Plex Mono",monospace;}
  #commandClose{
    background:var(--chip-bg);border:1px solid var(--panel-border);color:var(--muted);
    width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex:none;
  }
  #commandList{flex:1;overflow-y:auto;padding:14px 20px 20px;}
  .deal-card{background:var(--chip-bg);border:1px solid var(--panel-border);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .deal-card .dtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .deal-card .dclient{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:19px;}
  .deal-card .dservice{font-size:12px;color:var(--muted);margin-top:1px;}
  .deal-card .dprice{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;flex:none;}
  .deal-steps{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .dstep{
    display:flex;align-items:center;gap:6px;font-size:11px;font-family:"IBM Plex Mono",monospace;
    padding:6px 10px;border-radius:999px;background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--muted);
  }
  .dstep .sdot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
  .dstep.done{color:var(--ink);}
  .dstep.done .sdot{background:var(--status-paid);}
  .dstep.pending .sdot{background:var(--muted);}
  .dstep.blocked .sdot{background:#D24E64;}
  .command-empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;}

  @media (max-width:720px){
    .roster-row .rname{width:auto;max-width:44%;}
    #topRow{align-items:flex-start;}
    header{max-width:46vw;}
    #topBtns{flex-wrap:wrap;justify-content:flex-end;}
  }

  @media (max-width:720px){
    #panel{top:auto;bottom:0;right:0;left:0;width:100%;height:min(56vh,480px);border-left:none;border-top:1px solid var(--panel-border);border-radius:18px 18px 0 0;transform:translateY(105%);}
    #panel.open{transform:translateY(0);}
    #legend{max-width:94vw;}
    header{max-width:74vw;}
  }
</style>
</head><body><canvas id="scene"></canvas>

<div id="app">
  <div id="topRow">
    <header>
      <span class="eyebrow" id="headerEyebrow">40 agents &middot; 8 departments</span>
      <h1>The Studio Floor</h1>
    </header>
    <div id="topBtns">
      <button class="pillbtn" id="commandBtn" type="button">Command Center</button>
      <button class="pillbtn" id="rosterBtn" type="button">All agents</button>
      <button class="pillbtn" id="resetViewBtn" type="button">Reset view</button>
    </div>
  </div>

  <div id="bottomRow">
    <div id="hint">drag to orbit &middot; scroll / pinch to zoom &middot; double-tap to zoom in/out &middot; right-drag to pan &middot; arrow keys also work &middot; click a pod or a person</div>
    <div id="legend"></div>
  </div>
</div>

<div id="rosterOverlay">
  <div id="rosterSheet">
    <div id="rosterHead">
      <div class="toprow">
        <div>
          <h2 id="rosterTitle">All Agents</h2>
          <div class="sub" id="rosterSub">live status, most active first</div>
        </div>
        <button id="rosterClose" type="button" aria-label="Close">&#10005;</button>
      </div>
      <input id="rosterSearch" type="text" placeholder="Search by name, task, or result&hellip;">
    </div>
    <div id="rosterList"></div>
  </div>
</div>

<div id="commandOverlay">
  <div id="commandSheet">
    <div id="commandHead">
      <div class="toprow">
        <div>
          <h2>Command Center</h2>
          <div class="sub" id="commandSub">every deal, its real status</div>
        </div>
        <button id="commandClose" type="button" aria-label="Close">&#10005;</button>
      </div>
    </div>
    <div id="commandList"></div>
  </div>
</div>

<div id="panel">
  <div class="topline">
    <div class="bar" id="panelBar"></div>
    <button id="panelClose" type="button" aria-label="Close">&#10005;</button>
  </div>
  <button id="panelBack" type="button" style="display:none;">&larr; Back to department</button>
  <div class="code" id="panelCode"></div>
  <h2 id="panelTitle"></h2>
  <div class="role" id="panelSub"></div>
  <div class="agents" id="panelAgents"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------- data ----------------
  // Departments are grouped into two shared bullpens (A: research/content/
  // software, B: sales/delivery/growth) — one enclosed room per group, each
  // department gets a row inside it. This is what actually closes the gaps:
  // fewer separate room shells, desks packed row-on-row like the reference
  // floor plan, instead of 6 small rooms scattered across open floor.
  var DEPARTMENTS = [
    { id:"strategy", code:"00", name:"Strategy & Operations", tag:"Runs the studio itself", cssVar:"--a-strategy", hex:0xC97F22, x:0, z:-8.4, boardroom:true,
      agents:[
        {name:"Chief of Staff", desc:"Prioritizes the studio's work queue, tracks capacity across all 35 agents."},
        {name:"Project Manager", desc:"Breaks a signed job into tasks and assigns them to the right department."},
        {name:"Finance & Bookkeeping Agent", desc:"Tracks invoices sent/paid, expenses, and margin per job."},
        {name:"Contract & Proposal Drafting Agent", desc:"Drafts SOWs, contracts, and NDAs from templates."},
        {name:"Quality Bar Agent", desc:"Reviews every deliverable against the client brief before it ships."}
      ]},
    { id:"research", code:"01", name:"Research & Intelligence", tag:"Finds the opportunities", cssVar:"--a-research", hex:0x1F9690, x:-8.5, z:-3.6, group:"A", row:0,
      agents:[
        {name:"Opportunity Scout", desc:"Scans for underserved niches and side-hustle categories worth entering."},
        {name:"Market Research Agent", desc:"Sizes a market: demand signals, pricing norms, buyer pain points."},
        {name:"Competitor Analysis Agent", desc:"Profiles competitors for a given niche or client."},
        {name:"Client / Lead Researcher", desc:"Builds a one-page dossier on a prospect before outreach."},
        {name:"Trend Scout", desc:"Tracks emerging tools, platforms, and demand shifts."}
      ]},
    { id:"content", code:"02", name:"Content & Creative", tag:"Writes and designs", cssVar:"--a-content", hex:0xD24E64, x:-8.5, z:-2.0, group:"A", row:1,
      agents:[
        {name:"Copywriter", desc:"Website, landing page, and ad copy."},
        {name:"SEO / Blog Writer", desc:"Long-form articles and SEO content."},
        {name:"Social Media Agent", desc:"Platform-native posts and a content calendar."},
        {name:"Video / Podcast Script Agent", desc:"Scripts and outlines for video or audio content."},
        {name:"Brand & Graphic Design Agent", desc:"Brand guides, simple graphics, and slide decks."}
      ]},
    { id:"software", code:"03", name:"Software & Technical", tag:"Builds the deliverable", cssVar:"--a-software", hex:0x3560CC, x:-8.5, z:-0.4, group:"A", row:2,
      agents:[
        {name:"Full-Stack Dev Agent", desc:"Builds websites, small apps, and integrations."},
        {name:"Automation / Scripting Agent", desc:"Builds workflow automations that save a client real hours."},
        {name:"Data Analyst Agent", desc:"Cleans data and builds dashboards or reports."},
        {name:"QA / Testing Agent", desc:"Tests everything before it ships."},
        {name:"DevOps / Deployment Agent", desc:"Handles hosting, deployment, and uptime monitoring."}
      ]},
    { id:"sales", code:"04", name:"Sales & Client Acquisition", tag:"Turns leads into signed jobs", cssVar:"--a-sales", hex:0x2F9350, x:8.5, z:-3.6, group:"B", row:0,
      agents:[
        {name:"Outreach / Cold Email Agent", desc:"Drafts personalized outreach at volume — never sends without approval."},
        {name:"Proposal Writer", desc:"Turns a scoped opportunity into a priced proposal."},
        {name:"Sales Call Prep Agent", desc:"Preps talking points, objections, and pricing anchors."},
        {name:"CRM / Pipeline Manager Agent", desc:"Tracks every lead's stage and next action."},
        {name:"Partnerships Agent", desc:"Finds agencies and platforms worth partnering with."}
      ]},
    { id:"delivery", code:"05", name:"Client Delivery & Support", tag:"Keeps clients happy", cssVar:"--a-delivery", hex:0x6E4FCC, x:8.5, z:-2.0, group:"B", row:1,
      agents:[
        {name:"Onboarding Agent", desc:"Turns a signed deal into a kickoff packet and intake form."},
        {name:"Account Manager Agent", desc:"Owns the client relationship day-to-day."},
        {name:"Support / Help Desk Agent", desc:"Answers routine client questions and triages issues."},
        {name:"Deliverable QA Reviewer", desc:"Final check that what's shipping matches what was promised."},
        {name:"Documentation Agent", desc:"Writes handoff docs, SOPs, and how-to guides."}
      ]},
    { id:"growth", code:"06", name:"Growth & Marketing", tag:"Builds inbound demand", cssVar:"--a-growth", hex:0xB33F94, x:8.5, z:-0.4, group:"B", row:2,
      agents:[
        {name:"SEO Agent", desc:"Keyword strategy and on-page SEO."},
        {name:"Paid Ads Agent", desc:"Drafts ad copy, targeting, and budget plans."},
        {name:"Email Marketing Agent", desc:"Builds nurture sequences and newsletters."},
        {name:"Community / Engagement Agent", desc:"Drafts engagement content for communities and forums."},
        {name:"Analytics / Reporting Agent", desc:"Tracks what's actually converting across the studio."}
      ]},
    { id:"lasttouch", code:"07", name:"Last Touch", tag:"Final check before anything reaches a customer", cssVar:"--a-lasttouch", hex:0xB8901E, x:0, z:3.6, door:["north","south"],
      agents:[
        {name:"Grammar & Copy Editor", desc:"Proofreads every client-facing draft for grammar, spelling, and clarity."},
        {name:"Visual & Formatting Reviewer", desc:"Checks layout, formatting, and visual polish on anything client-facing."},
        {name:"Tone & Sensitivity Reviewer", desc:"Screens for offensive language, insensitive phrasing, or anything that could upset a customer."},
        {name:"Brand Consistency Checker", desc:"Verifies every draft matches Edgex's identity, pricing, and compliance rules exactly."},
        {name:"Final Release Coordinator", desc:"Collects all four Last Touch checks into one go/no-go verdict before anything reaches your approval queue."}
      ]},

    // ---------------- Edgex Clips: the video/social content wing, connected
    // south of Last Touch, same 40-agent-studio conventions throughout ----------------
    { id:"trend-intel", code:"08", name:"Trend Intelligence", tag:"Finds what's trending, right now", cssVar:"--a-research", hex:0x1F9690, x:-8.5, z:15.25, group:"C", row:0,

    A: { depts:["research","content","software"], cx:-8.5, cz:-2.0, door:"east" },
    B: { depts:["sales","delivery","growth"], cx:8.5, cz:-2.0, door:"west" },

  var ROOM_DOOR = {

    B:         { inside:{x:4.225,  z:-2.0}, outside:{x:3.425,  z:-2.0} },

    var t = new THREE.CanvasTexture(c);

  var brickTex = canvasTex(function(ctx,w,h){
    ctx.fillStyle = "#8a4a3a"; ctx.fillRect(0,0,w,h);
    var bw=32, bh=16, mortar=2;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for(var y=0;y<h;y+=bh){
      var offset = (Math.round(y/bh)%2===0) ? 0 : bw/2;
      for(var x=-bw;x<w+bw;x+=bw){
        ctx.fillRect(x+offset, y, mortar, bh);
      }
      ctx.fillRect(0,y,w,mortar);
    }
    for(var i=0;i<900;i++){
      ctx.fillStyle = "rgba(0,0,0,"+(Math.random()*0.08)+")";
      ctx.fillRect(Math.random()*w, Math.random()*h, 2,2);
    }
  }, 256,128, 6, 1.4);

  var woodTex = canvasTex(function(ctx,w,h){

    for(var i=0;i<planks;i++){
      var shade = 96 + Math.round(Math.sin(i*12.9)*10) + (i%2===0?6:0);
      ctx.fillStyle = "rgb("+(shade+30)+","+(shade+8)+","+(shade-18<0?0:shade-18)+")";
      ctx.fillRect(i*pw,0,pw,h);
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      ctx.fillRect(i*pw,0,2,h);
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      for(var g=0;g<h;g+=6) ctx.fillRect(i*pw+4, g, pw-8, 1);
    }

  // ---------------- prop builders ----------------
  function makeSign(text, y, z_offset){
    var scale = 4;
    var c = document.createElement("canvas");
    var ctx = c.getContext("2d");
    var font = "700 " + (28*scale) + "px 'Big Shoulders Display', sans-serif";
    ctx.font = font;
    var padX = 22*scale;
    var w = Math.ceil(ctx.measureText(text.toUpperCase()).width) + padX*2;
    var h = 54*scale;
    c.width=w; c.height=h;
    ctx = c.getContext("2d");
    ctx.font = font;
    ctx.fillStyle = "rgba(20,20,20,0.001)"; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "#ffffff";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.letterSpacing = (1.5*scale)+"px";
    ctx.fillText(text.toUpperCase(), w/2, h/2+2*scale);
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
    var sprite = new THREE.Sprite(mat);
    var worldH = 0.62;
    sprite.scale.set(worldH*(w/h), worldH, 1);
    sprite.position.set(0, y, z_offset||0);
    return sprite;
  }

  var nameTagCache = {};
  function makeNameTag(text){
    if(nameTagCache[text]) return nameTagCache[text].clone();
    var scale = 6;
    var c = document.createElement("canvas");
    var ctx = c.getContext("2d");
    var font = "600 " + (13*scale) + "px 'Work Sans', sans-serif";
    ctx.font = font;
    var padX = 10*scale, padY = 6*scale;
    var w = Math.ceil(ctx.measureText(text).width) + padX*2;
    var h = 13*scale + padY*2;
    c.width=w; c.height=h;
    ctx = c.getContext("2d");
    var r = h*0.32;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.arcTo(w,0,w,h,r); ctx.arcTo(w,h,0,h,r); ctx.arcTo(0,h,0,0,r); ctx.arcTo(0,0,w,0,r);
    ctx.closePath();
    ctx.fillStyle = "rgba(15,17,21,0.72)";
    ctx.fill();
    ctx.font = font;
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, w/2, h/2+scale*0.5);
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, sizeAttenuation:true});
    var sprite = new THREE.Sprite(mat);
    var worldH = 0.22;
    sprite.scale.set(worldH*(w/h), worldH, 1);
    nameTagCache[text] = sprite;
    return sprite.clone();
  }

  var SHIRT_COLORS = [0x3a4a5c,0x5c4a3a,0x445c4a,0x5c3a4a,0x39424a,0xE5E0D5,0x7a6a55,0x4a5c5c];
  var people = [];
  var AGENT_GROUPS = {};      // agentId -> {group, origin:{x,z}, home:{x,z}, seatRotY, walk:null}
  var PERSON_HIT_MESHES = []; // invisible hit-spheres for click/tap raycasting, tagged with agentId
  var BOARDROOM_SEATS_WORLD = []; // empty guest chairs in the boardroom, used by the meeting-walk system

  function buildPerson(x,z,rotY,agentId,displayName,originX,originZ,seated){
    var g = new THREE.Group();
    var jitter = (Math.random()-0.5)*0.3;
    g.position.set(x,0,z); g.rotation.y = rotY + jitter;
    var isSeated = seated !== false; // desk/boardroom people sit; walkers stand

    var skin = SKIN_TONES[Math.floor(Math.random()*SKIN_TONES.length)];
    var shirt = SHIRT_COLORS[Math.floor(Math.random()*SHIRT_COLORS.length)];
    var pantsHex = 0x2c2f36 + (Math.floor(Math.random()*3) * 0x030303);
    var shoeHex = 0x1c1a18;
    var shirtMat = new THREE.MeshStandardMaterial({color:shirt, roughness:0.7});
    var skinMat = new THREE.MeshStandardMaterial({color:skin, roughness:0.6});
    var pantsMat = new THREE.MeshStandardMaterial({color:pantsHex, roughness:0.75});
    var shoeMat = new THREE.MeshStandardMaterial({color:shoeHex, roughness:0.5});

    // legs: replaces the old legless torso that read as "a box floating on
    // nothing". Seated people (desks, boardroom) get a real bent-knee pose —
    // thigh resting at chair-seat height, shin down to the floor — so they
    // read as sitting in the chair rather than standing through it. Walkers
    // get straight standing legs instead.
    [-1,1].forEach(function(side){
      if(isSeated){
        var thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.068,0.062,0.32,10), pantsMat);
        thigh.position.set(side*0.085, 0.47, 0.16);
        thigh.rotation.x = Math.PI/2;
        thigh.castShadow = true;
        g.add(thigh);
        var shin = new THREE.Mesh(new THREE.CylinderGeometry(0.058,0.05,0.44,10), pantsMat);
        shin.position.set(side*0.085, 0.25, 0.32);
        shin.castShadow = true;
        g.add(shin);
        var shoe = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.06,0.17), shoeMat);
        shoe.position.set(side*0.085, 0.03, 0.36);
        shoe.castShadow = true;
        g.add(shoe);
      } else {
        var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.072,0.058,0.45,10), pantsMat);
        leg.position.set(side*0.085, 0.245, 0);
        leg.castShadow = true;
        g.add(leg);
        var shoe2 = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.06,0.17), shoeMat);
        shoe2.position.set(side*0.085, 0.03, -0.03);
        shoe2.castShadow = true;
        g.add(shoe2);
      }
    });

    // torso: shoulders slightly wider than the waist, rounder (more segments)
    // than before so it reads as a body, not a hard-edged cylinder
    var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.145,0.12,0.44,14), shirtMat);
    torso.position.y = 0.69; torso.castShadow = true;
    g.add(torso);

    var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.08,10), skinMat);
    neck.position.y = 0.945;
    g.add(neck);

    var head = new THREE.Mesh(new THREE.SphereGeometry(0.125,16,12), skinMat);
    head.position.y = 1.05;
    head.castShadow = true;
    g.add(head);

    var hair = new THREE.Mesh(new THREE.SphereGeometry(0.132,14,10,0,Math.PI*2,0,Math.PI*0.55), new THREE.MeshStandardMaterial({color:0x2a221c, roughness:0.85}));
    hair.position.y = 1.07;
    g.add(hair);

    // arms hang naturally at the sides instead of jutting forward — that
    // forward reach was what made the old figure read as extra legs
    [-1,1].forEach(function(side){
      var arm = new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.036,0.38,10), shirtMat);
      arm.position.set(side*0.19, 0.72, 0);
      arm.rotation.z = side*0.09;
      arm.castShadow = true;
      g.add(arm);
      var hand = new THREE.Mesh(new THREE.SphereGeometry(0.038,8,6), skinMat);
      hand.position.set(side*0.207, 0.53, 0);
      g.add(hand);
    });

    if(agentId){
      var badgeMat = new THREE.SpriteMaterial({map:badgeTex, color:STATUS_COLOR.idle, transparent:true, depthWrite:false});
      var badge = new THREE.Sprite(badgeMat);
      badge.scale.set(0.15,0.15,1);
      badge.position.set(0,1.32,0);
      g.add(badge);
      agentMeshes[agentId] = {mat:badgeMat};

      if(displayName){
        var tag = makeNameTag(displayName);
        tag.position.set(0,1.53,0);
        g.add(tag);
      }

      var hit = new THREE.Mesh(new THREE.SphereGeometry(0.3,8,6), new THREE.MeshBasicMaterial({transparent:true, opacity:0}));
      hit.position.set(0,0.75,0);
      hit.userData.agentId = agentId;
      g.add(hit);
      PERSON_HIT_MESHES.push(hit);

      AGENT_GROUPS[agentId] = {
        group:g,
        origin:{x:originX||0, z:originZ||0},
        home:{x:x, z:z},
        seatRotY:g.rotation.y,
        walk:null
      };
    }

    people.push({group:g, phase:Math.random()*Math.PI*2, baseRotY:g.rotation.y, agentId:agentId});
    return g;
  }

  // A real 4-wall room with a doorway gap on one side — replaces the old
  // 3-sided low partition so departments read as distinct enclosed rooms,
  // like the reference floor plan, not open pods on a rug.
  function buildEnclosedRoom(minX,maxX,minZ,maxZ,doorWalls,mat,wallH,doorW){
    wallH = wallH || 2.3; doorW = doorW || 1.3;
    if(!doorWalls) doorWalls = [];
    if(typeof doorWalls === "string") doorWalls = [doorWalls];
    var t = 0.1;
    var w = maxX-minX, dpt = maxZ-minZ;
    function seg(sw,sd,sx,sz){
      var m = new THREE.Mesh(new THREE.BoxGeometry(sw,wallH,sd), mat);
      m.position.set(sx,wallH/2,sz); m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
    }
    if(doorWalls.indexOf("south")!==-1){
      var hw1 = (w-doorW)/2;
      seg(hw1,t, minX+hw1/2, maxZ); seg(hw1,t, maxX-hw1/2, maxZ);
    } else { seg(w+t,t,(minX+maxX)/2,maxZ); }
    if(doorWalls.indexOf("north")!==-1){
      var hw2 = (w-doorW)/2;
      seg(hw2,t, minX+hw2/2, minZ); seg(hw2,t, maxX-hw2/2, minZ);
    } else { seg(w+t,t,(minX+maxX)/2,minZ); }
    if(doorWalls.indexOf("east")!==-1){
      var hd1 = (dpt-doorW)/2;
      seg(t,hd1, maxX, minZ+hd1/2); seg(t,hd1, maxX, maxZ-hd1/2);
    } else { seg(t,dpt+t,maxX,(minZ+maxZ)/2); }
    if(doorWalls.indexOf("west")!==-1){
      var hd2 = (dpt-doorW)/2;
      seg(t,hd2, minX, minZ+hd2/2); seg(t,hd2, minX, maxZ-hd2/2);
    } else { seg(t,dpt+t,minX,(minZ+maxZ)/2); }
  }

  function buildDeskPod(dept){
    // two parallel rows facing the same way, like a real cubicle island,
    // instead of one thin line of desks — denser and reads as an office floor.
    // Used for standalone single-department rooms (Last Touch).
    var n = dept.agents.length;
    var row1n = Math.ceil(n/2), row2n = n - row1n;
    var spacing = 1.55, rowGap = 1.8;
    var rowZ = [dept.z - rowGap/2, dept.z + rowGap/2];
    var rowCounts = [row1n, row2n];
    var maxRowSpan = Math.max(row1n,row2n)*spacing;
    var rug = new THREE.Mesh(new THREE.PlaneGeometry(maxRowSpan+1.0, rowGap+1.8), new THREE.MeshStandardMaterial({color:dept.hex, roughness:0.95, transparent:true, opacity:0.28}));
    rug.rotation.x = -Math.PI/2;
    rug.position.set(dept.x, 0.015, dept.z);
    rug.receiveShadow = true;
    scene.add(rug);
    var idx = 0;
    for(var r=0;r<2;r++){
      var count = rowCounts[r];
      var startX = -((count-1)*spacing)/2;
      for(var i=0;i<count;i++){
        var a = dept.agents[idx++];
        var g = buildWorkstation(dept.x + startX + i*spacing, rowZ[r], 0, dept.hex, a.id, a.name);
        scene.add(g);
      }
    }
    var sign = makeSign(dept.name, 2.5, 0);
    sign.position.x = dept.x; sign.position.z = dept.z - rowGap/2 - 1.5;
    scene.add(sign);
    var halfX = maxRowSpan/2 + 0.9, minZ = dept.z - rowGap/2 - 1.4, maxZ = dept.z + rowGap/2 + 1.05;
    buildEnclosedRoom(dept.x-halfX, dept.x+halfX, minZ, maxZ, dept.door, wallMat2, 2.3, 1.3);
    registerZone(dept, dept.x-halfX, dept.x+halfX, minZ, maxZ);
  }

  // One row of desks for one department, inside a SHARED group room (no
  // walls of its own — the group room builds one enclosure for every
  // department row it contains). This is what actually closes the gaps
  // between departments: one big bullpen instead of many small rooms.
  function buildDeptRow(dept, roomHalfWidth){
    var n = dept.agents.length, spacing = 1.55;
    var startX = -((n-1)*spacing)/2;
    var rug = new THREE.Mesh(new THREE.PlaneGeometry(roomHalfWidth*2-0.3, 1.5), new THREE.MeshStandardMaterial({color:dept.hex, roughness:0.95, transparent:true, opacity:0.22}));
    rug.rotation.x = -Math.PI/2;
    rug.position.set(dept.x, 0.015, dept.z);
    rug.receiveShadow = true;
    scene.add(rug);
    for(var i=0;i<n;i++){
      var a = dept.agents[i];
      var g = buildWorkstation(dept.x + startX + i*spacing, dept.z, 0, dept.hex, a.id, a.name);
      scene.add(g);
    }
    var sign = makeSign(dept.name, 1.55, 0);
    sign.position.set(dept.x - roomHalfWidth + 1.6, 1.55, dept.z);
    scene.add(sign);
    registerZone(dept, dept.x-roomHalfWidth, dept.x+roomHalfWidth, dept.z-0.78, dept.z+0.78);
  }

  function buildGroupRoom(groupKey){
    var grp = GROUPS[groupKey];
    var depts = grp.depts.map(function(id){
      var found = null;
      DEPARTMENTS.forEach(function(d){ if(d.id===id) found = d; });
      return found;
    });
    var spacing = 1.55, rowGapZ = 1.6;
    var n = depts[0].agents.length;
    var rowWidth = n*spacing;
    var roomHalfWidth = rowWidth/2 + 0.9;
    depts.forEach(function(d){ buildDeptRow(d, roomHalfWidth); });
    var minZ = depts[0].z - rowGapZ/2 - 0.9;
    var maxZ = depts[depts.length-1].z + rowGapZ/2 + 0.9;
    var minX = grp.cx - roomHalfWidth, maxX = grp.cx + roomHalfWidth;
    buildEnclosedRoom(minX, maxX, minZ, maxZ, grp.door, wallMat2, 2.3, 1.3);
  }

  function buildBoardroom(dept){
    var hw = 4.6, hd = 3.1, wallH = 2.1, gap = 2.0;
    function pw(w,h,d,x,y,z){ var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), glassMat); m.position.set(x,y,z); scene.add(m); return m; }
    function frameLine(w,h,d,x,y,z){ var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), frameMat); m.position.set(x,y,z); scene.add(m); }
    var cx = dept.x, cz = dept.z;
    pw(hw*2, wallH, 0.06, cx, wallH/2, cz-hd);
    pw(0.06, wallH, hd*2, cx-hw, wallH/2, cz);
    pw(0.06, wallH, hd*2, cx+hw, wallH/2, cz);
    pw((hw*2-gap)/2, wallH, 0.06, cx-(gap/2+(hw*2-gap)/4), wallH/2, cz+hd);
    pw((hw*2-gap)/2, wallH, 0.06, cx+(gap/2+(hw*2-gap)/4), wallH/2, cz+hd);
    frameLine(hw*2,0.08,0.08, cx, wallH, cz-hd);
    frameLine(0.08,0.08,hd*2, cx-hw, wallH, cz);
    frameLine(0.08,0.08,hd*2, cx+hw, wallH, cz);

    var table = new THREE.Mesh(new THREE.BoxGeometry(hw*1.55,0.08,1.7), new THREE.MeshStandardMaterial({color:0xece7dc, roughness:0.3}));
    table.position.set(cx, 0.74, cz-0.1); table.castShadow = true; table.receiveShadow = true;
    scene.add(table);
    var base = new THREE.Mesh(new THREE.BoxGeometry(hw*1.2,0.72,0.5), frameMat);
    base.position.set(cx,0.36,cz-0.1); scene.add(base);

    for(var i=-2;i<=2;i++){
      scene.add(buildChair(cx+i*1.5, cz-0.1-1.05, 0, dept.hex));
      scene.add(buildChair(cx+i*1.5, cz-0.1+1.05, Math.PI, dept.hex));
      scene.add(buildPerson(cx+i*1.5, cz-0.1-1.05, 0, dept.agents[i+2].id, dept.agents[i+2].name));
      BOARDROOM_SEATS_WORLD.push({x:cx+i*1.5, z:cz-0.1+1.05, rotY:Math.PI});
    }

    var scr1 = new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.05), new THREE.MeshBasicMaterial({map:screenTex}));
    scr1.position.set(cx-hw+0.08, 1.8, cz); scr1.rotation.y = Math.PI/2;
    scene.add(scr1);

    var sign = makeSign(dept.name, wallH+0.55, 0);
    sign.position.x = cx; sign.position.z = cz - hd + 0.4;
    scene.add(sign);

    registerZone(dept, cx-hw-0.2, cx+hw+0.2, cz-hd-0.2, cz+hd+0.2);
  }

  // ---------------- orbit camera (full manual control) ----------------
  var DEFAULT_ORBIT = { target:new THREE.Vector3(0,0.4,4), radius:33, theta:0.55, phi:0.82 };
  var orbit = { target:DEFAULT_ORBIT.target.clone(), radius:DEFAULT_ORBIT.radius, theta:DEFAULT_ORBIT.theta, phi:DEFAULT_ORBIT.phi };
  var targetRadius = orbit.radius;
  var MIN_R=3.2, MAX_R=48, MIN_PHI=0.08, MAX_PHI=1.55;
  var PAN_HX = BUILD_HX-0.5, PAN_Z_MIN = -(BUILD_Z_NORTH-0.5), PAN_Z_MAX = BUILD_Z_SOUTH-0.5;
  var spin = { vTheta:0, vPhi:0 }; // rotation momentum, decays each frame

  function applyOrbit(){
    var st = Math.sin(orbit.phi);
    camera.position.set(
      orbit.target.x + orbit.radius*st*Math.sin(orbit.theta),
      orbit.target.y + orbit.radius*Math.cos(orbit.phi),
      orbit.target.z + orbit.radius*st*Math.cos(orbit.theta)
    );
    camera.lookAt(orbit.target);
  }

  // ---------------- pointer controls ----------------
  var pointers = new Map();
  var twoFinger = null;
  var downInfo = null;
  var userInteracted = false;
  var raycaster = new THREE.Raycaster();

  function ndcFrom(x,y){ return { x:(x/innerWidth)*2-1, y:-(y/innerHeight)*2+1 }; }

  function doRotate(dx,dy,record){
    var dTheta = -dx*0.0052, dPhi = -dy*0.0052;
    orbit.theta += dTheta;
    orbit.phi = Math.max(MIN_PHI, Math.min(MAX_PHI, orbit.phi + dPhi));
    if(record){ spin.vTheta = dTheta; spin.vPhi = dPhi; }
  }
  function doPan(dx,dy){
    var s = orbit.radius*0.0016;
    var rx = Math.cos(orbit.theta), rz = -Math.sin(orbit.theta);
    var fx = Math.sin(orbit.theta), fz = Math.cos(orbit.theta);
    orbit.target.x -= (rx*dx - fx*dy)*s;
    orbit.target.z -= (rz*dx - fz*dy)*s;
    orbit.target.x = Math.max(-PAN_HX, Math.min(PAN_HX, orbit.target.x));
    orbit.target.z = Math.max(PAN_Z_MIN, Math.min(PAN_Z_MAX, orbit.target.z));
  }
  function doZoom(factor){
    targetRadius = Math.max(MIN_R, Math.min(MAX_R, targetRadius*factor));
  }

  canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  canvas.addEventListener("pointerdown", function(e){
    userInteracted = true;
    orbitAnim = null;
    spin.vTheta = 0; spin.vPhi = 0;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY, button:e.button});
    canvas.classList.add("dragging");
    if(pointers.size === 1){
      downInfo = {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now(), moved:false, button:e.button};
    } else {
      if(downInfo) downInfo.moved = true;
      twoFinger = null;
    }
  });

  canvas.addEventListener("pointermove", function(e){
    if(!pointers.has(e.pointerId)){
      // hover cursor feedback when not dragging
      if(pointers.size===0){
        var ndc = ndcFrom(e.clientX,e.clientY);
        raycaster.setFromCamera(ndc, camera);
        var personHit = raycaster.intersectObjects(PERSON_HIT_MESHES)[0];
        if(personHit){ canvas.classList.add("hover"); return; }
        var hit = raycaster.intersectObject(floor)[0];
        canvas.classList.toggle("hover", !!(hit && zoneAtPoint(hit.point.x, hit.point.z)));
      }
      return;
    }
    var entry = pointers.get(e.pointerId);
    var dx = e.clientX - entry.x, dy = e.clientY - entry.y;
    entry.x = e.clientX; entry.y = e.clientY;

    if(downInfo && downInfo.id===e.pointerId){
      if(Math.hypot(e.clientX-downInfo.x, e.clientY-downInfo.y) > 6) downInfo.moved = true;
    }

    if(pointers.size === 1){
      if(entry.button === 2) doPan(dx,dy); else doRotate(dx,dy,true);
    } else if(pointers.size === 2){
      var pts = Array.from(pointers.values());
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      var midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
      if(twoFinger){
        if(twoFinger.prevDist > 1) doZoom(twoFinger.prevDist/dist);
        doPan(midX-twoFinger.prevMidX, midY-twoFinger.prevMidY);
      }
      twoFinger = {prevDist:dist, prevMidX:midX, prevMidY:midY};
    }
  });

  var lastTapT = 0, lastTapX = 0, lastTapY = 0;
  function handleDoubleTapZoom(x, y){
    var ndc = ndcFrom(x, y);
    raycaster.setFromCamera(ndc, camera);
    var hit = raycaster.intersectObject(floor)[0];
    if(!hit) return;
    userInteracted = true;
    spin.vTheta = 0; spin.vPhi = 0;
    var zoomedIn = orbit.radius < DEFAULT_ORBIT.radius*0.55;
    var toRadius = zoomedIn ? DEFAULT_ORBIT.radius : Math.max(MIN_R, orbit.radius*0.4);
    var toTarget = zoomedIn ? DEFAULT_ORBIT.target.clone() : new THREE.Vector3(hit.point.x, 0.4, hit.point.z);
    orbitAnim = {
      t0: performance.now(), dur: prefersReducedMotion?1:550,
      fromTarget: orbit.target.clone(), toTarget: toTarget,
      fromRadius: orbit.radius, toRadius: toRadius,
      fromPhi: orbit.phi, toPhi: orbit.phi
    };
    targetRadius = toRadius;
  }
  function endPointer(e){
    var wasDown = downInfo && downInfo.id===e.pointerId;
    pointers.delete(e.pointerId);
    if(pointers.size < 2) twoFinger = null;
    if(pointers.size === 0) canvas.classList.remove("dragging");
    if(wasDown){
      if(!downInfo.moved && downInfo.button!==2 && (performance.now()-downInfo.t)<400){
        var ndc = ndcFrom(downInfo.x, downInfo.y);
        raycaster.setFromCamera(ndc, camera);
        var personHit = raycaster.intersectObjects(PERSON_HIT_MESHES)[0];
        if(personHit && personHit.object.userData.agentId){
          focusOnAgent(personHit.object.userData.agentId);
        } else {
          var hit = raycaster.intersectObject(floor)[0];
          if(hit){
            var dept = zoneAtPoint(hit.point.x, hit.point.z);
            if(dept) focusOn(dept);
          }
        }
        // double-tap/double-click: same spot, twice, quickly — zoom in on it,
        // or back out again if already zoomed in there
        var now = performance.now();
        if(now-lastTapT < 350 && Math.hypot(downInfo.x-lastTapX, downInfo.y-lastTapY) < 40){
          handleDoubleTapZoom(downInfo.x, downInfo.y);
          lastTapT = 0;
        } else {
          lastTapT = now; lastTapX = downInfo.x; lastTapY = downInfo.y;
        }
      }
      downInfo = null;
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  canvas.addEventListener("wheel", function(e){
    e.preventDefault();

    orbitAnim = null;

  }, {passive:false});

  window.addEventListener("keydown", function(e){
    var activeTag = document.activeElement && document.activeElement.tagName;
    if(activeTag === "INPUT" || activeTag === "TEXTAREA") return;
    var handled = true;
    switch(e.key){
      case "ArrowLeft": userInteracted=true; orbitAnim=null; spin.vTheta=0; spin.vPhi=0; doRotate(-55,0); break;
      case "ArrowRight": userInteracted=true; orbitAnim=null; spin.vTheta=0; spin.vPhi=0; doRotate(55,0); break;
      case "ArrowUp": userInteracted=true; orbitAnim=null; spin.vTheta=0; spin.vPhi=0; doRotate(0,-55); break;
      case "ArrowDown": userInteracted=true; orbitAnim=null; spin.vTheta=0; spin.vPhi=0; doRotate(0,55); break;
      case "+": case "=": userInteracted=true; orbitAnim=null; doZoom(0.85); break;
      case "-": case "_": userInteracted=true; orbitAnim=null; doZoom(1.18); break;
      case "0": userInteracted=true; resetView(); break;
      default: handled = false;

  function assignTask(agentId, inputEl, btnEl, msgEl){
    if(!agentsCol){ msgEl.textContent = "Live status isn't connected in this view."; return; }

  function buildAgentCard(a, expanded){

    var status = (live && live.status) || "idle";

    var el = document.createElement("div"); el.className="agent-card";
    var n = document.createElement("div"); n.className="name"; n.textContent=a.name;
    var de = document.createElement("div"); de.className="desc"; de.textContent=a.desc;

    var st = document.createElement("div"); st.className="status-line";
    var dot = document.createElement("span"); dot.className="status-dot"; dot.style.background = "#"+(STATUS_COLOR[status]||STATUS_COLOR.idle).toString(16).padStart(6,"0");
    var stText = document.createElement("span");
    stText.textContent = STATUS_LABEL[status] || status;
    st.appendChild(dot); st.appendChild(stText);
    el.appendChild(n); el.appendChild(de); el.appendChild(st);

    if(live && live.task){
      var taskLine = document.createElement("div"); taskLine.className="task-line";
      taskLine.textContent = "“"+live.task+"”";
      el.appendChild(taskLine);
    }
    if(live && live.result){
      var resultLine = document.createElement("div"); resultLine.className="task-line result-line";
      resultLine.textContent = live.result;
      el.appendChild(resultLine);
    }

    if(expanded){
      var next = document.createElement("div"); next.className="next-line";
      var nextText = NEXT_BY_DEPT[a.dept] || "";
      if(status === "idle"){
        next.innerHTML = "<b>Next:</b> hasn't been assigned real work yet — the autonomous shift (hourly) picks up whichever agents have waited longest.";
      } else if(status === "blocked"){
        next.innerHTML = "<b>Next:</b> blocked on something only the owner can supply — see the task above.";
      } else if(status === "working"){
        next.innerHTML = "<b>Next:</b> will report back with a real result once this task is done.";
      } else {
        next.innerHTML = "<b>Next:</b> "+nextText;
      }
      el.appendChild(next);
    }

    var row = document.createElement("div"); row.className="assign-row";
    var input = document.createElement("input"); input.type="text"; input.placeholder="Assign a task…"; input.maxLength=200;
    var btn = document.createElement("button"); btn.type="button"; btn.textContent="Assign";
    var msg = document.createElement("div"); msg.className="assign-msg";
    row.appendChild(input); row.appendChild(btn);
    el.appendChild(row); el.appendChild(msg);
    btn.addEventListener("click", function(){ assignTask(a.id, input, btn, msg); });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") assignTask(a.id, input, btn, msg); });

    return el;
  }

  function openPanel(dept){
    currentDept = dept;
    currentAgentId = null;
    panelBack.style.display = "none";
    document.getElementById("panelBar").style.background = "var("+dept.cssVar+")";
    document.getElementById("panelCode").textContent = "ROOM "+dept.code;
    document.getElementById("panelTitle").textContent = dept.name;
    document.getElementById("panelSub").textContent = dept.tag+" · "+dept.agents.length+" agents";
    var wrap = document.getElementById("panelAgents");
    wrap.innerHTML = "";
    dept.agents.forEach(function(a){ wrap.appendChild(buildAgentCard(a, false)); });
    panel.classList.add("open");
    document.getElementById("hint").classList.add("hidden");
  }

  function openAgentPanel(agentId){
    var entry = AGENT_BY_ID[agentId];
    if(!entry) return;
    currentDept = entry.dept;
    currentAgentId = agentId;
    panelBack.style.display = "block";
    panelBack.textContent = "← Back to "+entry.dept.name;
    document.getElementById("panelBar").style.background = "var("+entry.dept.cssVar+")";
    document.getElementById("panelCode").textContent = "ROOM "+entry.dept.code+" · "+entry.dept.name;
    document.getElementById("panelTitle").textContent = entry.a.name;
    document.getElementById("panelSub").textContent = entry.dept.tag;
    var wrap = document.getElementById("panelAgents");
    wrap.innerHTML = "";
    wrap.appendChild(buildAgentCard(entry.a, true));
    panel.classList.add("open");
    document.getElementById("hint").classList.add("hidden");
    updateLegendActive(entry.dept);
  }

  panelBack.addEventListener("click", function(){ if(currentDept) openPanel(currentDept); });

  function refreshPanelIfOpen(){
    if(!panel.classList.contains("open")) return;
    if(currentAgentId) openAgentPanel(currentAgentId);
    else if(currentDept) openPanel(currentDept);
  }
  document.getElementById("panelClose").addEventListener("click", function(){
    panel.classList.remove("open");
    currentDept = null;
    currentAgentId = null;
    Array.prototype.forEach.call(legend.children, function(btn){ btn.classList.remove("active"); });
  });

  // ---------------- live agent status (db capability) ----------------
  var agentsCol = null;
  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(db){
      if(!db) return;
      agentsCol = db.collection("agents");
      agentsCol.onSnapshot(function(snap){
        snap.docs.forEach(function(doc){
          agentStatus[doc.id] = doc.data();
          updateBadge(doc.id);
        });
        refreshPanelIfOpen();
        refreshRosterIfOpen();
      }, function(){ /* live status unavailable in this view; badges stay idle-grey */ });
    }).catch(function(){});
  }

  // ---------------- roster (all 35 agents, searchable) ----------------
  var ALL_AGENTS = [];
  DEPARTMENTS.forEach(function(dept){
    dept.agents.forEach(function(a){ ALL_AGENTS.push({a:a, dept:dept}); });
  });
  var STATUS_ORDER = {working:0, requested:1, blocked:1, done:2, idle:3};
  document.getElementById("headerEyebrow").textContent = ALL_AGENTS.length+" agents · "+DEPARTMENTS.length+" departments";
  document.getElementById("rosterTitle").textContent = "All "+ALL_AGENTS.length+" Agents";

  var rosterOverlay = document.getElementById("rosterOverlay");
  var rosterList = document.getElementById("rosterList");
  var rosterSearch = document.getElementById("rosterSearch");
  var rosterSub = document.getElementById("rosterSub");
  var rosterOpen = false;

  function renderRoster(){
    var q = rosterSearch.value.trim().toLowerCase();
    var rows = ALL_AGENTS.map(function(entry){
      var live = agentStatus[entry.a.id];
      var status = (live && live.status) || "idle";
      return {
        entry:entry, status:status,
        task: (live && live.task) || "", result: (live && live.result) || "",
        updatedAt: (live && live.updatedAt) || ""
      };
    }).filter(function(r){
      if(!q) return true;
      var hay = (r.entry.a.name+" "+r.entry.dept.name+" "+r.task+" "+r.result).toLowerCase();
      return hay.indexOf(q) !== -1;
    }).sort(function(r1,r2){
      var so = (STATUS_ORDER[r1.status]||3) - (STATUS_ORDER[r2.status]||3);
      if(so !== 0) return so;
      if(r1.updatedAt !== r2.updatedAt) return r1.updatedAt < r2.updatedAt ? 1 : -1;
      return r1.entry.a.name.localeCompare(r2.entry.a.name);
    });

    var activeCount = ALL_AGENTS.reduce(function(n,entry){
      var st = (agentStatus[entry.a.id]&&agentStatus[entry.a.id].status)||"idle";
      return n + (st==="working"||st==="requested"||st==="done" ? 1 : 0);
    }, 0);
    rosterSub.textContent = activeCount + " of " + ALL_AGENTS.length + " have done real work so far · live status, most active first";

    rosterList.innerHTML = "";
    if(rows.length === 0){
      var empty = document.createElement("div"); empty.className="roster-empty";
      empty.textContent = "No agents match “"+rosterSearch.value+"”.";
      rosterList.appendChild(empty);
      return;
    }
    var lastDept = null;
    rows.forEach(function(r){
      if(q === "" && r.entry.dept.id !== lastDept){
        lastDept = r.entry.dept.id;
        var h = document.createElement("div"); h.className="roster-dept";
        h.textContent = r.entry.dept.code+" · "+r.entry.dept.name;
        rosterList.appendChild(h);
      }
      var row = document.createElement("div"); row.className="roster-row";
      var dot = document.createElement("span"); dot.className="rdot";
      dot.style.background = "#"+(STATUS_COLOR[r.status]||STATUS_COLOR.idle).toString(16).padStart(6,"0");
      var name = document.createElement("span"); name.className="rname"; name.textContent = r.entry.a.name;
      var meta = document.createElement("span"); meta.className="rmeta";
      meta.textContent = r.result || r.task || r.entry.a.desc;
      var st = document.createElement("span"); st.className="rstatus"; st.textContent = r.status;
      row.appendChild(dot); row.appendChild(name); row.appendChild(meta); row.appendChild(st);
      row.addEventListener("click", function(){
        closeRoster();
        userInteracted = true;
        if(AGENT_GROUPS[r.entry.a.id]) focusOnAgent(r.entry.a.id);
        else focusOn(r.entry.dept);
      });
      rosterList.appendChild(row);
    });
  }
  function refreshRosterIfOpen(){ if(rosterOpen) renderRoster(); }
  function openRoster(){
    rosterOpen = true;
    rosterOverlay.classList.add("open");
    renderRoster();
  }
  function closeRoster(){
    rosterOpen = false;
    rosterOverlay.classList.remove("open");
  }
  document.getElementById("rosterBtn").addEventListener("click", openRoster);
  document.getElementById("rosterClose").addEventListener("click", closeRoster);
  rosterOverlay.addEventListener("click", function(e){ if(e.target===rosterOverlay) closeRoster(); });
  rosterSearch.addEventListener("input", renderRoster);

  // ---------------- command center (deals: sent / agreed / last touch / delivered / paid) ----------------
  var dealsCol = null;
  var deals = {};
  var commandOverlay = document.getElementById("commandOverlay");
  var commandList = document.getElementById("commandList");
  var commandSub = document.getElementById("commandSub");
  var commandOpen = false;
  var DEAL_STEPS = [
    {key:"outreach_sent", label:"Outreach sent"},
    {key:"deal_agreed", label:"Deal agreed"},
    {key:"last_touch_cleared", label:"Last Touch cleared"},
    {key:"work_delivered", label:"Delivered"},
    {key:"payment_received", label:"Paid"}
  ];
  function money(n, cur){
    try{ return new Intl.NumberFormat("en-US",{style:"currency",currency:(cur||"usd").toUpperCase()}).format(n); }
    catch(e){ return "$"+n; }
  }
  function renderCommand(){
    var ids = Object.keys(deals);
    if(ids.length === 0){
      commandSub.textContent = "no deals yet";
      commandList.innerHTML = "";
      var empty = document.createElement("div"); empty.className="command-empty";
      empty.textContent = "Nothing here yet — once Outreach Agent has a real prospect, it'll show up here with a live status you can track end to end.";
      commandList.appendChild(empty);
      return;
    }
    var paidCount = ids.filter(function(id){ return deals[id].steps && deals[id].steps.payment_received; }).length;
    commandSub.textContent = ids.length+" deal"+(ids.length===1?"":"s")+" tracked · "+paidCount+" paid";
    commandList.innerHTML = "";
    ids.sort(function(a,b){ return (deals[b].updatedAt||"") < (deals[a].updatedAt||"") ? -1 : 1; }).forEach(function(id){
      var d = deals[id];
      var steps = d.steps || {};
      var card = document.createElement("div"); card.className = "deal-card";
      var top = document.createElement("div"); top.className = "dtop";
      var left = document.createElement("div");
      var client = document.createElement("div"); client.className="dclient"; client.textContent = d.client || id;
      var service = document.createElement("div"); service.className="dservice"; service.textContent = d.service || "";
      left.appendChild(client); left.appendChild(service);
      var price = document.createElement("div"); price.className="dprice";
      price.textContent = (typeof d.price === "number") ? money(d.price, d.currency) : "";
      top.appendChild(left); top.appendChild(price);
      card.appendChild(top);

      var stepsRow = document.createElement("div"); stepsRow.className="deal-steps";
      DEAL_STEPS.forEach(function(s){
        var chip = document.createElement("div");
        var v = steps[s.key];
        chip.className = "dstep " + (v===true ? "done" : (v==="blocked" ? "blocked" : "pending"));
        var dot = document.createElement("span"); dot.className="sdot";
        var label = document.createElement("span"); label.textContent = s.label;
        chip.appendChild(dot); chip.appendChild(label);
        stepsRow.appendChild(chip);
      });
      card.appendChild(stepsRow);

      if(typeof d.amount_received === "number" && d.amount_received > 0){
        var paidLine = document.createElement("div");
        paidLine.style.marginTop = "10px"; paidLine.style.fontSize = "12px"; paidLine.style.color = "var(--muted)";
        paidLine.textContent = money(d.amount_received, d.currency) + " received so far";
        card.appendChild(paidLine);
      }

      commandList.appendChild(card);
    });
  }
  function refreshCommandIfOpen(){ if(commandOpen) renderCommand(); }
  function openCommand(){ commandOpen = true; commandOverlay.classList.add("open"); renderCommand(); }
  function closeCommand(){ commandOpen = false; commandOverlay.classList.remove("open"); }
  document.getElementById("commandBtn").addEventListener("click", openCommand);
  document.getElementById("commandClose").addEventListener("click", closeCommand);
  commandOverlay.addEventListener("click", function(e){ if(e.target===commandOverlay) closeCommand(); });

  window.addEventListener("keydown", function(e){
    if(e.key!=="Escape") return;
    if(commandOpen) closeCommand();
    else if(rosterOpen) closeRoster();
  });

  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(db){
      if(!db) return;
      dealsCol = db.collection("deals");
      dealsCol.onSnapshot(function(snap){
        deals = {};
        snap.docs.forEach(function(doc){ deals[doc.id] = doc.data(); });
        refreshCommandIfOpen();
      }, function(){ /* live deals unavailable in this view */ });
    }).catch(function(){});
  }

  // ---------------- ambient collaboration ----------------
  // People occasionally walk over to a colleague's desk, or into the boardroom's
  // empty guest chairs for a few minutes, then walk back. Who moves is weighted
  // toward agents with a real "working"/"done" status from the live board — this
  // is ambience layered on real activity, not a claim about any specific exchange.
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    return arr;
  }
  // Which physical, walled room an agent actually sits in — walks are only
  // ever allowed between two agents in the SAME room, because that's the
  // only case where a straight line between two desks can't cross a wall.
  // Grouped departments (the two shared bullpens) share one room; everyone
  // else (Last Touch, Strategy's boardroom) is already room-scoped by id.
  function roomKeyOf(id){
    var entry = AGENT_BY_ID[id];
    if(!entry) return null;
    return entry.dept.group || entry.dept.id;
  }
  function collabCandidates(preferBusy, roomKey){
    return ALL_AGENTS.map(function(e){ return e.a.id; }).filter(function(id){
      var rec = AGENT_GROUPS[id];
      if(!rec || rec.walk) return false;
      if(roomKey && roomKeyOf(id) !== roomKey) return false;
      if(!preferBusy) return true;
      var st = statusOf(id);
      return st==="working" || st==="done";
    });
  }
  // A walk can now be a PATH of waypoints, not just one target — that's what
  // lets an agent leave their room, cross the corridor, and enter a
  // different room (the Collaboration Room or the boardroom) without ever
  // cutting through a wall: each waypoint is either the destination, or a
  // door's corridor-side point, and every leg between two consecutive
  // waypoints is guaranteed to be inside one open space (one room, or the
  // corridor) with nothing in between.
  function startWalkPath(agentId, worldWaypoints, holdSeconds){
    var rec = AGENT_GROUPS[agentId];
    if(!rec || rec.walk || !worldWaypoints.length) return false;
    var path = worldWaypoints.map(function(p){ return {x:p.x-rec.origin.x, z:p.z-rec.origin.z}; });
    rec.walk = {
      path: path, segIdx: 0,
      fromLocal:{x:rec.group.position.x, z:rec.group.position.z},
      toLocal: path[0],
      phase:"out", t:0, hold:holdSeconds
    };
    return true;
  }
  function startWalk(agentId, targetWorldX, targetWorldZ, holdSeconds){
    return startWalkPath(agentId, [{x:targetWorldX, z:targetWorldZ}], holdSeconds);
  }
  function updateAgentWalks(dt){
    Object.keys(AGENT_GROUPS).forEach(function(id){
      var rec = AGENT_GROUPS[id];
      var w = rec.walk;
      if(!w) return;
      if(w.phase==="out" || w.phase==="back"){
        var dx = w.toLocal.x-w.fromLocal.x, dz = w.toLocal.z-w.fromLocal.z;
        var dist = Math.max(0.5, Math.hypot(dx,dz));
        w.t += dt*(1.15/dist);
        var e = Math.min(1, w.t);
        rec.group.position.x = w.fromLocal.x + dx*e;
        rec.group.position.z = w.fromLocal.z + dz*e;
        rec.group.position.y = Math.abs(Math.sin(elapsed*8))*0.035;
        if(dist > 0.2) rec.group.rotation.y = Math.atan2(dx,dz);
        if(e>=1){
          w.segIdx++;
          if(w.segIdx < w.path.length){
            w.fromLocal = w.toLocal; w.toLocal = w.path[w.segIdx]; w.t = 0;
          } else if(w.phase==="out"){
            w.phase="hold"; w.t=0;
          } else {
            rec.walk=null; rec.group.position.y=0; rec.group.rotation.y=rec.seatRotY;
          }
        }
      } else if(w.phase==="hold"){
        w.t += dt;
        rec.group.position.y = Math.sin(elapsed*1.6)*0.01;
        if(w.t>=w.hold){
          var backPath = w.path.slice(0,-1).reverse();
          backPath.push(rec.home);
          w.path = backPath; w.segIdx = 0;
          w.fromLocal = {x:rec.group.position.x, z:rec.group.position.z};
          w.toLocal = w.path[0];
          w.phase = "back"; w.t = 0;
        }
      }
    });
  }

  // Every seat a cross-room meeting can use, and whether it's occupied —
  // shared by both meeting rooms so sessions don't double-book a seat.
  var MEETING_SEATS = { collab: COLLAB_SEATS, team: BOARDROOM_SEATS_WORLD };
  function claimSeats(kind, n){
    var open = MEETING_SEATS[kind].filter(function(s){ return !s.taken; });
    var picked = shuffle(open).slice(0, n);
    picked.forEach(function(s){ s.taken = true; });
    return picked;
  }
  function releaseSeatWhenDone(seat, agentId){
    var check = setInterval(function(){
      var rec = AGENT_GROUPS[agentId];
      if(!rec || !rec.walk){ seat.taken = false; clearInterval(check); }
    }, 1200);
  }

  var nextCollabAt = 5 + Math.random()*5;
  var ROOM_KEYS = ["A","B","lasttouch","strategy","C","D","P","video-lasttouch","E","F"];
  function maybeStartCollaboration(){
    if(prefersReducedMotion || ALL_AGENTS.length===0) return;
    var roll = Math.random();

    if(roll < 0.32){
      // Quick chat: walk straight to a colleague's own desk, same room only.
      var rooms = shuffle(ROOM_KEYS.slice());
      for(var r=0;r<rooms.length;r++){
        var busy = shuffle(collabCandidates(true, rooms[r]));
        if(busy.length < 2) busy = shuffle(collabCandidates(false, rooms[r]));
        if(busy.length >= 2){
          var recB = AGENT_GROUPS[busy[1]];
          var wp = new THREE.Vector3(); recB.group.getWorldPosition(wp);
          startWalk(busy[0], wp.x+0.55, wp.z+0.4, 4+Math.random()*3);
          break;
        }
      }
    } else if(roll < 0.72){
      // Collaboration Room: 2-3 agents, any room(s), each walks its own
      // door, through the corridor, to the shared table — visibly
      // converging on each other there. Only rooms with a real ROOM_DOOR
      // entry connect to this corridor — Edgex Clips' wing isn't wired
      // into it (yet), so its agents sit this one out rather than getting
      // routed with an empty/invalid path.
      var pool = shuffle(collabCandidates(true).filter(function(id){ return !!ROOM_DOOR[roomKeyOf(id)]; }));
      if(pool.length < 2) pool = shuffle(collabCandidates(false).filter(function(id){ return !!ROOM_DOOR[roomKeyOf(id)]; }));
      var n = Math.min(pool.length, 2+Math.floor(Math.random()*2));
      var seats = claimSeats("collab", n);
      for(var i=0;i<seats.length;i++){
        var id = pool[i];
        var seat = seats[i];
        var path = corridorPath(roomKeyOf(id)).concat([{x:seat.x,z:seat.z}]);
        var ok = startWalkPath(id, path, 10+Math.random()*8);
        if(ok) releaseSeatWhenDone(seat, id);
      }
    } else {
      // Team meeting: 1-2 non-strategy agents sit in on the boardroom's
      // empty guest chairs, routed through the corridor and both real doors.
      var visitors = shuffle(collabCandidates(true).filter(function(id){ return roomKeyOf(id) !== "strategy" && !!ROOM_DOOR[roomKeyOf(id)]; }));
      if(visitors.length < 1) visitors = shuffle(collabCandidates(false).filter(function(id){ return roomKeyOf(id) !== "strategy" && !!ROOM_DOOR[roomKeyOf(id)]; }));
      var vn = Math.min(visitors.length, 1+Math.floor(Math.random()*2));
      var vseats = claimSeats("team", vn);
      for(var j=0;j<vseats.length;j++){
        var vid = visitors[j];
        var vseat = vseats[j];
        var path = corridorPath(roomKeyOf(vid))
          .concat([ROOM_DOOR.strategy.outside, ROOM_DOOR.strategy.inside])
          .concat([{x:vseat.x,z:vseat.z}]);
        var vok = startWalkPath(vid, path, 9+Math.random()*7);
        if(vok) releaseSeatWhenDone(vseat, vid);
      }
    }
    nextCollabAt = elapsed + 8 + Math.random()*10;
  }

  // ---------------- main loop ----------------
  var clock = new THREE.Clock();
  var elapsed = 0;
  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function frame(){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, clock.getDelta());
    elapsed += dt;

    if(!prefersReducedMotion){
      people.forEach(function(p){
        if(p.agentId && AGENT_GROUPS[p.agentId] && AGENT_GROUPS[p.agentId].walk) return; // mid-walk, owns its own transform this frame
        p.group.position.y = Math.sin(elapsed*1.6+p.phase)*0.012;
        p.group.rotation.y = p.baseRotY + Math.sin(elapsed*0.7+p.phase)*0.07;
      });
      updateAgentWalks(dt);
      if(elapsed >= nextCollabAt) maybeStartCollaboration();
      walkers.forEach(function(w){
        w.t += w.dir*dt*w.speed;
        if(w.t>1){ w.t=1; w.dir=-1; }
        if(w.t<0){ w.t=0; w.dir=1; }
        var x = w.a.x+(w.b.x-w.a.x)*w.t, z = w.a.z+(w.b.z-w.a.z)*w.t;
        var facing = Math.atan2(w.b.x-w.a.x, w.b.z-w.a.z) + (w.dir<0?Math.PI:0);
        w.group.position.set(x, Math.abs(Math.sin(elapsed*8))*0.035, z);
        w.group.rotation.y = facing;
      });
    }

    if(orbitAnim){
      var t = Math.min(1, (performance.now()-orbitAnim.t0)/orbitAnim.dur);
      var e = easeInOut(t);
      orbit.target.lerpVectors(orbitAnim.fromTarget, orbitAnim.toTarget, e);
      orbit.radius = orbitAnim.fromRadius + (orbitAnim.toRadius-orbitAnim.fromRadius)*e;
      orbit.phi = orbitAnim.fromPhi + (orbitAnim.toPhi-orbitAnim.fromPhi)*e;
      if(orbitAnim.fromTheta!==undefined) orbit.theta = orbitAnim.fromTheta + (orbitAnim.toTheta-orbitAnim.fromTheta)*e;
      if(t>=1) orbitAnim = null;
    } else if(!userInteracted && !prefersReducedMotion){
      orbit.theta += dt*0.06;
    } else if(!prefersReducedMotion && pointers.size===0 && (Math.abs(spin.vTheta)>0.00004 || Math.abs(spin.vPhi)>0.00004)){
      // momentum: keep spinning briefly after a rotate drag, decaying to a stop
      orbit.theta += spin.vTheta;
      orbit.phi = Math.max(MIN_PHI, Math.min(MAX_PHI, orbit.phi + spin.vPhi));
      spin.vTheta *= 0.92; spin.vPhi *= 0.92;
    }

    if(!orbitAnim) orbit.radius += (targetRadius - orbit.radius) * Math.min(1, dt*10);

    applyOrbit();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
